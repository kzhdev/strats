
@include "config/global.cfg"

resources = (
    @include "config/test.cme.multi.mem.cfg"

// CME MD MULTIPLE RECEIVER
    {
        //name="cme" type="cme::mdp::CMEHandlerEPOLL" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        name="cme" type="cme::mdp::CMEHandlerEPOLLWithSnapshot" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        //
        symbols="symbols"
        //
        channels="channels"
        //
