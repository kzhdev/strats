@include "config/sim/cme/global.cfg"

resources = (
   @include "config/sim/cme/ice_feed_shared.cfg"
   // LOGGING
       ,{
               name="logger" type="logging::Client"
               port=30251
       },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        sc_id=20
        //
        request: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.request.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.request.recovery" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.reply.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.reply.recovery" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.reject.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.reject.recovery" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.debug.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.debug.recovery" } memsize=10000000 }
        }
    },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/pavel.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="config/sim/cme/omports.csv"
    },
    // OM GW1
    {
        name="omGW1" type="cme::om::Gateway" enabled=true

        monitor : { enabled=true port=21738 }
        limits  : { enabled=true file="config/sim/cme/omlimits.csv" }
        #limits  : { enabled=true file="omlimits.csv" }
        
        symbols="symbols"

        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb: { enabled=true async=false host="localhost" port=31427 table="omX" useStringSerializer=true}
            kdb-om: { enabled=true async=false host="localhost" port=31427 table="omXOM" useStringSerializer=true}
        }

        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )

        @include "config/sim/cme/om-recovery-db.cfg"

        risk_limits: "rhoneRiskLimits"
        risk : { enabled=false host="localhost" port=10107 }
        port : { name="CME_ME" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        reconnect = true
        loginRetry : { enabled=true numRetryAttempts=1000000 }
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
         )

        logclient: { name = "logger" }
        round_trip_limit = 100
        sliding-throttler : { period=1, orders=475 }
        sendLegFills=true
        msgwConfigXML="config/sim/cme/MSGW_Config.xml"
        msgwPrimaryOrBackup="primary" 
        SeqNumMemoryFile : { file="./seqnum/my.seqnum" }
        InitialOidFile : { file="./initial_oid.bin" }
    },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR_2" type="om::Orders" id="recovery_2"
    },
    {
        name="omqCLIENTR_2" type="om::Queues"
        //
        orders="omoCLIENTR"
        //
        sc_id = 20
        request: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.request.recovery.2" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.request.recovery.2" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.reply.recovery.2" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.reply.recovery.2" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.reject.recovery.2" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.reject.recovery.2" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/pavel.queue.debug.recovery.2" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/pavel.pool.debug.recovery.2" } memsize=10000000 }
        }
    },
// OM GW2
    {
        name="omGW2" type="cme::om::Gateway" enabled=false

        monitor : { enabled=true port=26748 }
        limits  : { enabled=true file="./config/sim/cme/omlimits.csv" }
        #limits  : { enabled=true file="omlimits.csv" }

        symbols="symbols"

        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb: { enabled=true async=false host="localhost" port=31427 table="omX" useStringSerializer=true}
            kdb-om: { enabled=true async=false host="localhost" port=31427 table="omXOM" useStringSerializer=true}
        }

        om-queues = (
            { name="omqCLIENT2" }, {name="omqCLIENTR_2" recovery-client=true }
        )

        @include "config/sim/cme/om-recovery-db.cfg"

        risk : { enabled=false host="localhost" port=10107 }

        port : { name="CME_ME_2" }

        ports : { name="omPORTS" }

        risk_limits: "rhoneRiskLimits"
        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        logclient: { name = "logger" }
        round_trip_limit = 100
        sliding-throttler : { period=1, orders=475 }
        sendLegFills=true
        recover-working-orders-fills=false
        InitialOidFile : { file="./initial_oid_2.bin" }
    },
    {
        name = "threader_1"
        type = "om::RoundRobinThreadingModel_CME"
        enabled = true

        threads : (
            { method=0 affinity="PROD" cpu=14 policy="FIFO" },
            { method=1 affinity="PROD" cpu=15 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )

        components : (
            { name = "omGW1" },
            //{ name = "omGW2" },
        )
    },
)
