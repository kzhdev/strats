@include "config/global.cfg"

resources = (
    {
        name="symbols" type="md::Symbols"
        file="/home/pythonsvc/sim/models/current/secDb.txt"
    },
    {
        name="simulator" type="cme::MatchingEngine"

        threads = (
            { method=0 affinity="PROD" cpu=9 policy="FIFO" }
        )

        incremental : {
            addr="239.80.138.75"
            port=18668
            ttl=64
            net_if="10.80.30.88"
        }

        snapshot : {
            addr="239.80.138.76"
            port=18669
            ttl=64
            net_if="10.80.30.88"
        }

        settingsFile = "./config/settings.cfg"

        symbols="symbols"

        speed_bump = 5000

        venue = "CME"
    },
   // LOGGING
   ,{
           name="logger" type="logging::Client"
           port=30151
   },
   {
       name="omqCLIENT1" type="om::Queues"
       //
       orders="omoCLIENT1"
       //
       request: {
           mem : { shm="PROD" shmname="./shm/match_engine.queue.request.client" hugetlb=false lock="PROD" numa=-1 }
           qty=10000000 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.request.client" } memsize=5000000000 }
       }
       reply: {
           mem : { shm="PROD" shmname="./shm/match_engine.queue.reply.client" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.reply.client" } memsize=10000000 }
       }
       reject: {
           mem : { shm="PROD" shmname="./shm/match_engine.queue.reject.client" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.reject.client" } memsize=10000000 }
       }
       debug: {
           mem : { shm="PROD" shmname="./shm/match_engine.queue.debug.client" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.debug.client" } memsize=10000000 }
       }
   },
   // CLIENT OM
   {
       name="omoCLIENT1" type="om::Orders"
       //
       mem : { shm=true shmname="./shm/me.o.client1" hugetlb=false lock="PROD" numa=-1 }
   },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/match_engine.recovery.client" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/match_engine.queue.request.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.request.recovery" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/match_engine.queue.reply.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.reply.recovery" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/match_engine.queue.reject.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.reject.recovery" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/match_engine.queue.debug.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/match_engine.pool.debug.recovery" } memsize=10000000 }
        }
    },
// OM
    {
        name="omTRADERS" type="om::Traders"
    },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/match_engine.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/omports.csv"
    },
    {
        name="cmeRequests" type="om::CMERequests"
        mem : { shm=true shmname="./shm/match_engine.requests" hugetlb=false lock="PROD" numa=-1 }
        team_prefix="28"
    },
// OM GW1
    {
        name="omGW1" type="cme::om::GatewayS" enabled=false
        threads = (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )

        requests="cmeRequests"

        monitor : { enabled=true port=21737 }
        limits  : { enabled=true file="./config/omlimits.csv" }
        #limits  : { enabled=true file="omlimits.csv" }

        symbols="symbols"

        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb: { enabled=true async=false host="localhost" port=31427 table="omX" useStringSerializer=true}
            kdb-om: { enabled=true async=false host="localhost" port=31427 table="omXOM" useStringSerializer=true}
        }

        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )

        @include "config/om-recovery-db.cfg"

        risk : { enabled=false host="localhost" port=10107 }

        port : { name="CME_GW1" }

        ports : { name="omPORTS" }

        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        logclient: { name = "logger" }

        sliding-throttler : { period=1, orders=100 }
        sendLegFills=true
        recover-working-orders-fills=false
        #SeqNumMemoryFile : { file="./seqnum/ICE_OS4.seqnum" }
        InitialOidFile : { file="./initial_oid.bin" }
    }
)
