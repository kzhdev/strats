@include "./config/sim/cme/global.cfg"
resources = (
@include "./config/sim/cme/ice_feed_shared.cfg"
   ,{
       name="MD_Log_Client" type="logging::Client"
       host="localhost" port=30151
   },
   {
       name = "MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
       mem : { shm=true shmname="./123234234235.queue" hugetlb=false lock=true numa=-1 }
       qty = 10000 pool={ mem: { shm=true shmname="./2354234563456.pool" } memsize=10000000 }
       event_mode = true
   },
  {
      name = "MD_KDB_Logger" type = "hf::DebugQueueLogger"
      logclient : { name = "MD_Log_Client"} debug-queue : {name = "MD_KDB_Log_Queue"}
      auto-populate-timestamp = true
  }
// ICE MD
  ,{
     //name="ice" type="Cme::MBO::EndOfEventBook::MSockets"
     name="ice" type="Cme::MBO::EndOfEventBookWithFAKRemoval::MSockets"

     //
     symbols="symbols"
     channels="channels"
     //
     send_implied=true
     //
     md-queues = (
        { name="mdqICE" },
        { name="mdqICE_2" },
        { name="mdqICE_3" }
     )
     om-queues = (
         { om="omqCLIENT1" },
         { om="omqCLIENT2" }
     )

     kdb_logger = "MD_KDB_Logger"

     //heartbeatIntervalInMilliseconds=2000

     threads = (
         { method=0 affinity="PROD" cpu=19 policy="FIFO" },
         { method=1 }
     )
     monitor : { enabled=true port=30244 internalTimeoutInSeconds=3000001 }

     mcast : {
         if="MD_IF"
         groups = (
            { enabled=true name="382" }
            )
         }
   }
)
