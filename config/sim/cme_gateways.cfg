@include "global.cfg"

resources = (
   @include "ice_feed_shared.cfg"
   // LOGGING
       ,{
               name="logger" type="logging::Client"
               port=30151
       },
    // RECOVERY-CLIENT OM
    {
        name="cme_omoCLIENTR" type="om::Orders" id="recovery"
    },
    {
        name="cme_omqCLIENTR" type="om::Queues"
        //
        orders="cme_omoCLIENTR"
        sc_id=9915003

        request_queue_size = 10000
        request_entries = 100

        reply_queue_size = 10000
        reply_entries = 100

        reject_queue_size = 10000
        reject_entries = 100

        debug_queue_size = 10000000
        debug_entries = 100000
    },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/pavel.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/omports_ice.csv"
    },
    {
        name="cmeRequests" type="om::CMERequests"
        mem : { shm=true shmname="./shm/c.pavel.requests" hugetlb=false lock="PROD" numa=-1 }
        team_prefix="28"
    },
// OM GW1
    {
        name="cme_omGW1" type="cme::om::Gateway" enabled=true

        //requests="cmeRequests"

        monitor : { enabled=true port=21838 }
        limits  : { enabled=true file="./config/omlimits.csv" }
        #limits  : { enabled=true file="omlimits.csv" }

        symbols="symbols"

        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb: { enabled=true async=false host="localhost" port=31427 table="omX" useStringSerializer=true}
            kdb-om: { enabled=true async=false host="localhost" port=31427 table="omXOM" useStringSerializer=true}
        }

        om-queues = (
            { name="cme_omqCLIENT1" }, {name="cme_omqCLIENTR" recovery-client=true }
        )

	    @include "config/om-recovery-db.cfg"

        risk : { enabled=false host="localhost" port=10107 }

        port : { name="CME_ME" }

        ports : { name="omPORTS" }

        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        traderSenderSubIDMapping = (
            { trader="Taj" senderSubID="154N" location="US,IL"},
            { trader="Mark" senderSubID="154B" location="US,IL"},
            { trader="Steven" senderSubID="154A" location="US,IL"},
            { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )

        risk_limits: "rhoneRiskLimits"
        logclient: { name = "logger" }
        round_trip_limit = 100
        sliding-throttler : { period=1, orders=475 }
        sendLegFills=true
        recover-working-orders-fills=false
        #SeqNumMemoryFile : { file="./seqnum/ICE_OS4.seqnum" }
        InitialOidFile : { file="./initial_oid.bin" }
    },
    {
    	name = "threader_cme1"
    	type = "om::RoundRobinThreadingModel_CME"
    	enabled = true

    	threads : (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
    	)


    	components : (
    		{ name = "cme_omGW1" }
    	)
    }
        // RECOVERY-CLIENT OM
        {
            name="cme_omoCLIENTR_2" type="om::Orders" id="recovery_2"
        },
        {
            name="cme_omqCLIENTR_2" type="om::Queues"
            //
            orders="cme_omoCLIENTR"
            sc_id=9915003

            request_queue_size = 10000
            request_entries = 100

            reply_queue_size = 10000
            reply_entries = 100

            reject_queue_size = 10000
            reject_entries = 100

            debug_queue_size = 10000000
            debug_entries = 100000
        },
)
