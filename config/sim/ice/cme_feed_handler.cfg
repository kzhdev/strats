@include "config/sim/ice/global.cfg"
resources = (
@include "config/sim/ice/ice_feed_shared.cfg"
   ,{
       name="CME_MD_Log_Client" type="logging::Client"
       host="localhost" port=30251
   },
   {
       name = "CME_MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
       mem : { shm=true shmname="./123234234237.queue" hugetlb=false lock=true numa=-1 }
       qty = 10000 pool={ mem: { shm=true shmname="./2354234563458.pool" } memsize=10000000 }
       event_mode = true
   },
  {
      name = "CME_MD_KDB_Logger" type = "hf::DebugQueueLogger"
      logclient : { name = "CME_MD_Log_Client"} debug-queue : {name = "CME_MD_KDB_Log_Queue"}
      auto-populate-timestamp = true
  }
// ICE MD
  ,{
     //name="cme" type="Cme::MBO::EndOfEventBook::MSockets"
     name="cme" type="Cme::MBO::EndOfEventBookWithFAKRemoval::MSockets"
     //
     symbols="symbols"
     channels="channels"
     //
     send_implied=true
     //queue_position_opts=3
     //
     md-queues = (
        { name="cme_mdqICE" },
        { name="cme_mdqICE_2" },
        { name="cme_mdqICE_3" }
     )
     om-queues = (
         { om="cme_omqCLIENT1" }
     )

     kdb_logger = "MD_KDB_Logger"

     //heartbeatIntervalInMilliseconds=2000

     threads = (
         { method=0 affinity="PROD" cpu=20 policy="FIFO" },
         { method=1 }
     )
