@include "config/sim/ice/global.cfg"

resources = (
   @include "config/sim/ice/ice_feed_shared.cfg"
   // LOGGING
       ,{
               name="logger" type="logging::Client"
               port=30251
       },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        sc_id=9915003
        //
        request_queue_size = 10000
        request_entries = 100

        reply_queue_size = 10000
        reply_entries = 100

        reject_queue_size = 10000
        reject_entries = 100

        debug_queue_size = 10000000
        debug_entries = 100000
    },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/pavel.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="config/sim/ice/omports_ice.csv"
    },
// OM GW1
    {
        name="omGW1" type="ice::om::Gateway" enabled=true

        monitor : { enabled=true port=21738 }
        limits  : { enabled=true file="config/sim/ice/omlimits.csv" }
        #limits  : { enabled=true file="omlimits.csv" }

        symbols="symbols"

        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb: { enabled=true async=false host="localhost" port=31427 table="omX" useStringSerializer=true}
            kdb-om: { enabled=true async=false host="localhost" port=31427 table="omXOM" useStringSerializer=true}
        }

        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )

	    @include "config/sim/ice/om-recovery-db.cfg"

        risk : { enabled=false host="localhost" port=10107 }

        port : { name="ICE_ME" }

        ports : { name="omPORTS" }

        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        traderOnBehalfOfSubIDMapping = (
            { trader="Taj" onBehalfOfSubID="taj1"},
            { trader="Mark" onBehalfOfSubID="mark"},
            { trader="Steven" onBehalfOfSubID="stev"},
            { trader="Zhi" onBehalfOfSubID="zchen"}
        )

        logclient: { name = "logger" }

        risk_limits: "rhoneRiskLimits"
        sliding-throttler : { period=1, orders=275 }
        sendLegFills=false
        #SeqNumMemoryFile : { file="./seqnum/ICE_OS4.seqnum" }
        InitialOidFile : { file="./initial_oid.bin" }
        round_trip_limit = 1000
    },
    {
    	name = "threader_1"
    	type = "om::RoundRobinThreadingModel_ICE"
    	enabled = true

    	threads : (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
    	)


    	components : (
    		{ name = "omGW1" }
    	)
    }
)
