@include "config/global.cfg"

resources = (
   @include "config/minimal_cme/cme_feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30251
     },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
@if __RHONE_MAJOR_VERSION__ < 55
        mem : { shm="PROD" shmname="./shm/pavel.orders.recovery.client" hugetlb=false lock="PROD" numa=-1 }
@endif
    },
     {
         name="omqCLIENTR" type="om::Queues"
         //
         orders="omoCLIENTR"
@if __RHONE_MAJOR_VERSION__ >= 55
         sc_id=9915003
@endif

@if __RHONE_MAJOR_VERSION__ < 55
         //
         request: {
             mem : { shm="PROD" shmname="./shm/vipermin.queue.request.recovery" hugetlb=false lock="PROD" numa=-1 }
             qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.request.recovery" } memsize=10000 }
         }
         //
         reply: {
             mem : { shm="PROD" shmname="./shm/vipermin.queue.reply.recovery" hugetlb=false lock="PROD" numa=-1 }
             qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reply.recovery" } memsize=10000 }
         }
         reject: {
             mem : { shm="PROD" shmname="./shm/vipermin.queue.reject.recovery" hugetlb=false lock="PROD" numa=-1 }
             qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reject.recovery" } memsize=10000 }
         }
         debug: {
             mem : { shm="PROD" shmname="./shm/vipermin.queue.debug.recovery" hugetlb=false lock="PROD" numa=-1 }
             qty=100000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.debug.recovery" } memsize=10000000 }
         }
@else
         request_queue_size = 10000000
         request_entries = 100000

         reply_queue_size = 10000000
         reply_entries = 100000

         reject_queue_size = 10000000
         reject_entries = 100000

         debug_queue_size = 10000000
         debug_entries = 100000
@endif
     },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/vipermin.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/minimal_cme/omports.csv"
    },
    // OM GW1
    {
        name="omGW1" type="cme::om::Gateway" enabled=true id=1
        //
        monitor : { enabled=true port=23139 }
        limits  : {
          enabled=true
          file="./config/minimal_cme/omlimits.csv"
        }
        //
        symbols="symbols"
        //
        @include "config/om-recovery-db.cfg"
        disableResendRequestOnGap  : false
        //
        logclient: { name = "logger" }
        //
        risk_limits: "rhoneRiskLimits"
        //
        requests="cmeRequests"
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )
        //
        ctiCodeOverride = (
            { pattern="CL.*" ctiCode="4" },
            { pattern="GE.*" ctiCode="4" }
        )
        //
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )
        //
        risk : { enabled=false host="localhost" port=10107 }
        //
        port : { name="CME_MR8_80" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        sendLegFills=true
        //
        msgwConfigXML="./config/minimal_cme/MSGW_Config.xml"
        msgwPrimaryOrBackup = "primary"

        SeqNumMemoryFile : { file="./seqnum/CME_M5C_82.seqnum" }

        sliding-throttler : { period=3, orders=1400 }
    },
    {
    	name = "threader_1"
    	type = "om::RoundRobinThreadingModel_CME"
    	enabled = true

    	threads : (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
    	)


    	components : (
    		{ name = "omGW1" }
    	)
    }
)
