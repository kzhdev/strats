// SYMBOLS
    {
        name="symbols" type="md::Symbols"
        file="./config/minimal_cme/secdb.cme.csv"
    },
    {
        name="rhoneRiskLimits" type="om::RiskLimits" enabled=true
        mem : { shm="PROD" shmname= "./shm/risklimits.cfg" }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
@if __RHONE_MAJOR_VERSION__ >= 55
        sc_id=9915003
@endif
        //
@if __RHONE_MAJOR_VERSION__ < 55
        request: {
            mem : { shm="PROD" shmname="./shm/min.queue.request.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.request.client" } memsize=10000000 }
        }
        reply: {
            mem : { shm="PROD" shmname="./shm/min.queue.reply.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.reply.client" } memsize=10000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/min.queue.reject.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.reject.client" } memsize=10000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/min.queue.debug.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.debug.client" } memsize=10000000 }
        }
@else
        request_queue_size = 10000000
        request_entries = 100000

        reply_queue_size = 10000000
        reply_entries = 100000

        reject_queue_size = 10000000
        reject_entries = 100000

        debug_queue_size = 10000000
        debug_entries = 100000
@endif
    },
