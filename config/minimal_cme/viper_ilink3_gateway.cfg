@include "config/global.cfg"

resources = (
   @include "config/minimal_cme/cme_feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30251
     },
     {
          name="debugLoggerCME1" type="hf::queue::DebugQueue"
          qty=1000000 id="38101"
          event_mode=false
          mem : { shmname="./shm/hf.diq.cme.om1" }
          pool : {
                  memsize=100000000 id="38101"
                  mem : { shmname="./shm/hf.dip.cme.om1" }
            }
     },
     {
        name="debugQueueLogger" type="hf::DebugQueueLogger"
        logclient={ name="logger" }
        debug-queue={ name="debugLoggerCME1" }
     },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/vipermin.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/minimal_cme/omports_iLink3.csv"
    },
    // OM GW1
    {
        name="omGW1" type="cme_binary::om::GatewayOnDemandRegistration" enabled=true id=1
        //
        monitor : { enabled=true port=23139 }
        limits  : {
          enabled=true
          file="./config/minimal_cme/omlimits.csv"
        }
        //
        symbols="symbols"
        //
        @include "config/om-recovery-db.cfg"
        disableResendRequestOnGap  : false
        //
        logclient: { name = "logger" }
        //
        risk_limits: "rhoneRiskLimits"
        //
        requests="CMEiLink3Requests"
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        ctiCodeOverride = (
            { pattern="CL.*" ctiCode="4" },
            { pattern="GE.*" ctiCode="4" }
        )
        //
        traderSenderIDMapping = (
             { trader="Taj" sender_id="154N" location="US,IL"},
             { trader="Mark" sender_id="154B" location="US,IL"},
             { trader="Steven" sender_id="154A" location="US,IL"},
             { trader="Zhi" sender_id="FA64" location="US,IL"}
        )
        //
        risk : { enabled=false host="localhost" port=10107 }
        //
        port : { name="CME_MFK154_80" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        sendLegFills=true
        //
        msgwConfigXML="./config/minimal_cme/MSGW_Config.xml"
        msgwPrimaryOrBackup = "primary"

        SeqNumMemoryFile : { file="./seqnum/CME_M5C_82.seqnum" }

        sliding-throttler : { period=3, orders=1400 }

        SessionMemoryFile: {
            file-directory="./shm"
        }

        directDebugQueue1="debugQueueLogger"
    },
    {
    	name = "threader_1"
    	type="om::RoundRobinThreadingModel_CME_iLink3_OnDemandRegistration"
    	enabled = true

    	threads : (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
    	)


    	components : (
    		{ name = "omGW1" }
    	)
    }
)
