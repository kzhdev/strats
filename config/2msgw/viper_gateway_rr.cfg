@include "config/global.cfg"

resources = (
   @include "config/2msgw/cme_feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/pavel.orders.recovery.client" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.request.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.request.recovery" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reply.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reply.recovery" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reject.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reject.recovery" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.debug.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.debug.recovery" } memsize=10000000 }
        }
    },
    // RECOVERY-CLIENT OM 2
    {
        name="omoCLIENTR2" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/pavel.orders.recovery.client2" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENTR2" type="om::Queues"
        //
        orders="omoCLIENTR2"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.request.recovery2" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.request.recovery2" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reply.recovery2" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reply.recovery2" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reject.recovery2" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reject.recovery2" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.debug.recovery2" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.debug.recovery2" } memsize=10000000 }
        }
    },
    {
        name="omPORTS" type="om::Ports"
        mem : { shm="PROD" shmname="./shm/vipermin.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/2msgw/omports.csv"
    },
    {
        name="cmeRequests" type="om::CMERequests"
        mem : { shm=true shmname="./shm/cme.requests" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="cmeRequests2" type="om::CMERequests"
        mem : { shm=true shmname="./shm/cme.requests2" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="cmeRequests3" type="om::CMERequests"
        mem : { shm=true shmname="./shm/cme.requests2" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="cmeRequests4" type="om::CMERequests"
        mem : { shm=true shmname="./shm/cme.requests2" hugetlb=false lock="PROD" numa=-1 }
    },
    //OM Market Segment GW 1,1 [82, CME Eurodollar Futures]
    {
         name="omMSGW_M5C_82" type="cme::om::GatewayS" enabled=true
         //
         limits  : { enabled=true file="/home/cmilutinovic/sim/models/ffwzt/omlimits.csv" }
         //
         requests="cmeRequests"
         //
         symbols="symbols"
         //
         @include "config/om-recovery-db.cfg"
         //
         port : {name = "CME_M5C_82" }
         //
         ports : { name="omPORTS" }
         //
         traders="omTRADERS"
         //
         msgwConfigXML="./config/2msgw/MSGW_Config.xml"
         msgwPrimaryOrBackup = "primary"
         logclient: { name = "logger" }
         sendLegFills=true
         //
         SeqNumMemoryFile : { file="./seqnum/omMSGW_M5C_82.seqnum" }
         //
         sliding-throttler : { period=1, orders=100 }
    },
    //OM Market Segment GW 1,2 [84, CBOT Treasury Futures]
    {
         name="omMSGW_M5C_84" type="cme::om::GatewayS" enabled=true
         //
         limits  : { enabled=true file="/home/cmilutinovic/sim/models/ffwzt/omlimits.csv" }
         //
         requests="cmeRequests2"
         //
         symbols="symbols"
         //
         @include "config/om-recovery-db.cfg"
         //
         port : {name = "CME_M5C_84" }
         //
         ports : { name="omPORTS" }
         //
         traders="omTRADERS"
         //
         msgwConfigXML="./config/2msgw/MSGW_Config.xml"
         msgwPrimaryOrBackup = "primary"
         logclient: { name = "logger" }
         sendLegFills=true
         //
         SeqNumMemoryFile : { file="./seqnum/omMSGW_M5C_84.seqnum" }
         //
         sliding-throttler : { period=1, orders=100 }
    },
    //Gateway Container 1 [82+84]
    {
        name="omGwC_1" type="cme::om::GatewayContainer" id=1 enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 affinity="PROD" cpu=3 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        monitor : { enabled=true port=10706 }
        //
        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb : { enabled=true async=false host="localhost" port=31427 table="omX"}
        }
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )
        //
        ports : { name="omPORTS" }
        //
        traders="omTRADERS"
        //
        symbols="symbols"
        //
        recover-working-orders-fills : true
        //
        market_segment_gateways = (
            { name = "omMSGW_M5C_82" },
            { name = "omMSGW_M5C_84" }
        )
        //
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )
        sendLegFills=true
    },
    //OM Market Segment GW 2,1 [82, CME Eurodollar Futures]
    {
         name="omMSGW_MR8_82" type="cme::om::GatewayS" enabled=true
         //
         limits  : { enabled=true file="/home/cmilutinovic/sim/models/ffwzt/omlimits.csv" }
         //
         requests="cmeRequests"
         //
         symbols="symbols"
         //
         @include "config/om-recovery-db.cfg"
         //
         port : {name = "CME_MR8_82" }
         //
         ports : { name="omPORTS" }
         //
         traders="omTRADERS"
         //
         msgwConfigXML="./config/2msgw/MSGW_Config.xml"
         msgwPrimaryOrBackup = "primary"
         logclient: { name = "logger" }
         sendLegFills=true
         //
         SeqNumMemoryFile : { file="./seqnum/omMSGW_MR8_82.seqnum" }
         //
         sliding-throttler : { period=1, orders=100 }
    },
    //OM Market Segment GW 2,2 [84, CBOT Treasury Futures]
    {
         name="omMSGW_MR8_84" type="cme::om::GatewayS" enabled=true
         //
         limits  : { enabled=true file="/home/cmilutinovic/sim/models/ffwzt/omlimits.csv" }
         //
         requests="cmeRequests2"
         //
         symbols="symbols"
         //
         @include "config/om-recovery-db.cfg"
         //
         port : {name = "CME_MR8_84" }
         //
         ports : { name="omPORTS" }
         //
         traders="omTRADERS"
         //
         msgwConfigXML="./config/2msgw/MSGW_Config.xml"
         msgwPrimaryOrBackup = "primary"
         logclient: { name = "logger" }
         sendLegFills=true
         //
         SeqNumMemoryFile : { file="./seqnum/omMSGW_MR8_84.seqnum" }
         //
         sliding-throttler : { period=1, orders=100 }
    },
    //Gateway Container 2 [82+84]
    {
        name="omGwC_2" type="cme::om::GatewayContainer" id=1 enabled=true //If name is too long, gets truncated!
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 affinity="PROD" cpu=3 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        monitor : { enabled=true port=10707 }
        //
        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb : { enabled=true async=false host="localhost" port=31427 table="omX"}
        }
        //
        om-queues = (
            { name="omqCLIENT2" }, {name="omqCLIENTR2" recovery-client=true }
        )
        //
        ports : { name="omPORTS" }
        //
        traders="omTRADERS"
        //
        symbols="symbols"
        //
        recover-working-orders-fills : true
        //
        market_segment_gateways = (
            { name = "omMSGW_MR8_82" },
            { name = "omMSGW_MR8_84" }
        )
        //
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )
        sendLegFills=true
    },
)
