@include "config/global.cfg"

resources = (
   @include "config/2msgw/cme_feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR1" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/orders.recovery.1.client" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omoCLIENTR2" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/orders.recovery.2.client" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENTR1" type="om::Queues"
        //
        orders="omoCLIENTR1"
        //
        sc_id = 9915005
        //
        request: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.request.1.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.request.1.recovery" } memsize=1000000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reply.1.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reply.1.recovery" } memsize=1000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reject.1.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reject.1.recovery" } memsize=1000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.debug.1.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.debug.1.recovery" } memsize=10000000 }
        }
    },
    {
        name="omqCLIENTR2" type="om::Queues"
        //
        orders="omoCLIENTR2"
        //
        sc_id = 9915005
        //
        request: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.request.2.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.request.2.recovery" } memsize=1000000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reply.2.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reply.2.recovery" } memsize=1000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.reject.2.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.reject.2.recovery" } memsize=1000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/vipermin.queue.debug.2.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=10000 pool={ mem: { shm="PROD" shmname="./shm/vipermin.pool.debug.2.recovery" } memsize=10000000 }
        }
    },
    // OM omMSGW1_82
    {
        name="omMSGW1_82" type="cme::om::GatewayS" enabled=true
        //
        limits  : { enabled=true file="./config/2msgw/omlimits.csv" }
        //
        symbols="symbols"
        risk_limits="rhoneRiskLimits"
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR1" recovery-client=true }
        )
        //
        sliding-throttler : { period=3, orders=1400 }
        //
        @include "config/om-recovery-db.cfg"
        SeqNumMemoryFile : { file="./seqnum/CME_M5C_GWC_NORR_82.seqnum" }
        //
        port : { name="CME_M5C_GWC_NORR_82" }
        ports : { name="omPORTS" }
        //
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )
        //
        logclient: { name = "logger" }
        traders="omTRADERS"
        //
        msgwConfigXML="./config/2msgw/MSGW_Config.xml"
        msgwPrimaryOrBackup = "primary"
    },
    // OM omMSGW1_84
    {
        name="omMSGW1_84" type="cme::om::GatewayS" enabled=true
        //
        limits  : { enabled=true file="./config/2msgw/omlimits.csv" }
        //
        symbols="symbols"
        risk_limits="rhoneRiskLimits"
        //
        om-queues = (
            { name="omqCLIENT2" }, {name="omqCLIENTR2" recovery-client=true }
        )
        //
        sliding-throttler : { period=3, orders=1400 }
        //
        @include "config/om-recovery-db.cfg"
        SeqNumMemoryFile : { file="./seqnum/CME_M5C_GWC_NORR_84.seqnum" }
        //
        port : { name="CME_M5C_GWC_NORR_84" }
        ports : { name="omPORTS" }
        //
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )
        //
        logclient: { name = "logger" }
        traders="omTRADERS"
        //
        msgwConfigXML="./config/2msgw/MSGW_Config.xml"
        msgwPrimaryOrBackup = "primary"
   },
   {
       name = "threader_cmegw"
       type = "om::RoundRobinThreadingModel_CME"
       enabled = true

       threads : (
           { method=0 affinity="PROD" cpu=9 policy="FIFO" },
           { method=1 affinity="PROD" cpu=10 policy="FIFO" },
           { method=2 },
           { method=3 },
           { method=4 }
       )

       components : (
           { name = "omMSGW1_82" },
           { name = "omMSGW1_84" }
       )
   },
)
