
@include "config/global.cfg"
resources = (
// SYMBOLS
    {
        name="symbols" type="md::Symbols"
        mem : { shm="PROD" shmname="./shm/hf.md.symbols"  }
        file="./config/secdb.cme.csv"
    },
// MD CHANNELS
    {
    name="channels" type="md::ChannelInfoResource"
    //
    file="./config/mdchannels.csv"
    },
// CME POOL
    {
        name="mdpCME" type="md::Pool"
        mem : { shm="PROD" shmname="./shm/hf.mdp.cme"  }
        memsize=100000000
    },
    {
        name="mdqCME1" type="md::Queue"
        mem : { shm="PROD" shmname="./shm/hf.mdq.cme"  }
        qty=100000 pool="mdpCME"
    },
// CME MD
    {
        name="cme"
        // type="cme::mdp::CMEHandlerEPOLL"
        type="cme::mdp::CMEHandlerEPOLLWithSnapshot"
        //
        symbols="symbols"
        channels="channels"
        //
        md-queues = (
            { name="mdqCME1" }
        )
        //
        thread : { affinity="PROD" cpu=22 policy="FIFO" }
        mcast : {
            if="MD_IF"
            groups = (
                // ES
                { enabled=true name="310" }
            )
        }
    },
// OM
    {
        name="omPORTS" type="om::Ports"
        //
        mem : { shm="PROD" shmname="./shm/hf.om.ports"  }
        file="./config/omports.csv"
    },
    {
        name="omTRADERS" type="om::Traders"
    },
// OM GW1
    {
        name="omGW1" type="cme::om::GatewayS" enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=23 policy="FIFO" },
            { method=1 affinity="PROD" cpu=24 policy="FIFO" },
            { method=2 }
        )
        //
        monitor : { enabled=true port=10102 }
        risk : { enabled=false host="localhost" port=10403 }
        limits : { enabled=true file="./config/omlimits.csv" }
        //
        symbols="symbols"
        //
        log : {
            file : { enabled=true filename="orders_log.csv" }
            mcast : { enabled=false if="127.0.0.1" ttl=0 addr="224.0.0.1" port=10104  }
            kdb : { enabled=true async=true host="localhost" port=10101 table="demo" }
            kdb-om : { enabled=true async=false host="localhost" port=10101 table="demo_orders" }
        }
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        port : { name="CME_C13" }
        //
        ports : { name="omPORTS" }
        traders="omTRADERS"
    },
// CLIENT OM
    {
        name="omoCLIENT1" type="om::Orders"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.client1" }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
        //
        request : {
            mem : { shm="PROD" shmname="./shm/hf.omq.request.client1" }
            qty=100000
            pool : {
                mem: { shm="PROD" shmname="./shm/hf.omp.request.client1" }
                memsize=10000000
            }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reply.client1" }
            qty=100000
            pool : {
                mem : { shm="PROD" shmname="./shm/hf.omp.reply.client1" }
                memsize=1000000
            }
        }
        reject : {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.client1" }
            qty=100000
            pool : {
                mem : { shm="PROD" shmname="./shm/hf.omp.reject.client1" }
                memsize=1000000
            }
        }
    },
// PROXY
    {
        name="proxy" type="strat::Proxy" enabled=true
        //
        threads = (
            { method=0 affinity="PROD" cpu=25 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 } // ADMIN
        )
        //
        admin : { enabled=true port=10105 if=""
            users = (
                { username="admin" password="demo" role="admin" },
                { username="guest" password="" role="readonly"  enabled=false }
            )
        }
        //
        symbols="symbols"
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        md-queues = (
            { name="mdqCME1" }
        )
        //
        strat="demo"
        //
        id=1
        //
        do_idle=false
        do_loop=false
        do_sent_timestamp=false
    },
// STRAT
    @include "config/inc.null.cfg"
)
