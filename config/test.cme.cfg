
@include "config/global.cfg"

resources = (
    {
        name="symbols" type="md::Symbols"
        mem : { shm="PROD" shmname="./shm/hf.md.symbols" hugetlb=false lock="PROD" numa=-1 }
        file="./config/secdb.cme.small.csv"
    },
    {
        name="mdpCME1" type="md::Pool"
        mem : { shm="PROD" shmname="hf.mdp.eurex" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
    {
        name="mdqCME1" type="md::Queue"
        mem : { shm="PROD" shmname="./shm/hf.mdq.cme" hugetlb=false lock="PROD" numa=-1 }
        //qty=100000 pool="mdpCME1"
        qty=1000000 pool="mdpCME1"
    },
    {
        name="channels" type="md::ChannelInfoResource"
        //
        file="./config/mdchannels.cme.cert.csv"
    },
    {
        name="cmeRequests" type="om::CMERequests"
        //
        mem : { shm="PROD" shmname="./shm/hf.omp.cmeRequests.gw1" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
// POSITION PERSISTENCE
    {
        name="positionPersisterService" type="oms::PositionPersisterService" enabled=true
        thread : { }
        mem : {
            pool  : { qty=65 shm="false" shmname="./shm/hf.positionPersister.pool"  }
            queue : { qty=65 shm="false" shmname="./shm/hf.positionPersister.queue" }
        }
    },
// LOGGING
    {
        name="logger" type="logging::Client"
        port=23985
    },
// CME MD MULTIPLE RECEIVER
    {
        //name="cme" type="cme::mdp::CMEHandlerEPOLL" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        name="cme" type="cme::mdp::CMEHandlerEPOLLWithSnapshot" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        //
        symbols="symbols"
        //
        channels="channels"
        //
        heartbeatIntervalInMilliseconds=1000
        //
        md-queues = (
            { name="mdqCME1" }
        )
        //
        threads = (
            { method=0 affinity="PROD" cpu=16 policy="FIFO" },
            { method=1 }
            )
        monitor : { enabled=true port=20707 internalTimeoutInSeconds=31 }
        mcast : {
            if="MD_IF" onload_filter=false
            groups = (
                { name="310" enabled=false},
                { name="312" enabled=false},
                { name="314" enabled=false},
                { name="316" enabled=false},
                { name="318" enabled=false},
                { name="320" enabled=false},
                { name="340" enabled=false},
                { name="342" enabled=false},
                { name="344" enabled=false},
                { name="346" enabled=false},
                { name="360" enabled=false},
                { name="380" enabled=false},
                { name="382" enabled=true},
                { name="384" enabled=false},
                { name="386" enabled=false},
                { name="410" enabled=false},
                { name="430" enabled=false},
                { name="440" enabled=false},
                { name="450" enabled=false},
                { name="460" enabled=false},
                { name="510" enabled=false},
                { name="520" enabled=false}
            )
        }
    },
// OM
    {
        name="omTRADERS" type="om::Traders"
    },
    {
        name="omPORTS" type="om::Ports"
        //
        mem : { shm="PROD" shmname="./shm/hf.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/omports.csv"
    },
// OM GW1
    {
        name="omGW1" type="cme::om::GatewayOms" enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 affinity="PROD" cpu=3 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        monitor : { enabled=true port=12610 }
        limits  : { enabled=true file="./config/omlimits.csv" }
        //
        requests="cmeRequests"
        //
        symbols="symbols"
        //
        logclient : { name = "logger" }
        //
        keep-gtc-orders = true
        @include "./config/om-recovery-db.cfg"
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )
        //
        sliding-throttler : { period=3 orders=125 }
        //
        //risk : { enabled=false host="localhost" port=10107 }
        //
        //port : { name="CME_1H0" }  //DEAD to GTCs
        port : { name="CME_1B3" }
        //port : { name="CME_1H0" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        nanosRoundtripLimit=10
        loginRetry : { enabled=false }
        //
        SeqNumMemoryFile : { file="./seqnum/CME_1H0.seqnum" }
    },
// CLIENT OM
    {
        name="omoCLIENT1" type="om::Orders"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.client1" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/hf.omq.request.client1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.client1" } memsize=10000000 }
        }
        reply: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reply.client1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.client1" } memsize=10000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.client1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.client1" } memsize=10000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.debug1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.debug1" } memsize=10000000 }
        }
    },
// RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.clientR" hugetlb=false lock="PROD" numa=-1 }
        //
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        //
        request: {
        mem : { shm="PROD" shmname="./shm/hf.omq.request.clientR" hugetlb=false lock="PROD" numa=-1 }
        qty=10000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.clientR" } memsize=1000000 }
        }
        //
        reply: {
        mem : { shm="PROD" shmname="./shm/hf.omq.reply.clientR" hugetlb=false lock="PROD" numa=-1 }
        qty=10000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.clientR" } memsize=1000000 }
        }
        reject: {
        mem : { shm="PROD" shmname="./shm/hf.omq.reject.clientR" hugetlb=false lock="PROD" numa=-1 }
        qty=10000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.clientR" } memsize=1000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.debugR" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.debugR" } memsize=10000000 }
        }
    },
// PROXY
    {
        name="proxy" type="strat::Proxy" id=7100 enabled=true
        //
        threads = (
            { method=0 affinity="PROD" cpu=1 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
        )
        //
        admin : { enabled=true port=32181 if=""
            users = (
                { username="admin" password="admin5" role="admin" },
                { username="guest" password="" role="readonly" enabled=false }
            )
        }
        //
        symbols="symbols"
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        md-queues = (
            { name="mdqCME1" }
        )
        monitor = {enabled=false}
        traders="omTRADERS"
        //
        strat="sms1"
    },
//STRAT SMS
    {
        name="sms1" type="oms::OrderServerStrategy" enabled=true
	    venue="CME"
	    positionPersisterService="positionPersisterService"

	    clientsAcceptor : { host="corlsd003" port=21279 } //Charles
        database : { server="CORWDP002\\GT_CRX_D_US" defaultDatabase="PermissionedProperties" useSqlAuthentication=false
                     userName="gsrisk" password="gsrisk" storedProcedureAuthenticationUsername="cmilutinovic" }
        mdtimeout : { defaultTimeoutInMilliseconds=32000 }

        //exists on corlsd003, big enough that I don't want to check it in.  The above below works, but is slow
        settlePrices : { serviceQuery = "./config/cme_settlement_prices.csv" }
        //settlePrices : { serviceQuery = "http://refdata-dev.service.genevatrading.com/instruments/?query=SecurityType:FUT&field=SecurityID&field=SecurityID&field=TradingReferencePrice&field=TradingReferenceDate&field=Symbol" }
    }
)
