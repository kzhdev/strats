@include "config/global.cfg"

resources = (
@include "config/minimal_eurex/eurex_feed_shared.cfg"
  ,{
      name="MD_Log_Client" type="logging::Client"
      host="localhost" port=30151
  },
  {
      name = "MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
      mem : { shm=true shmname="./shm/vmin.md.kdb.queue" hugetlb=false lock=true numa=-1 }
      qty = 10000 pool={ mem: { shm=true shmname="./shm/vmin.md.kdb.pool" } memsize=10000000 }
      event_mode = true
  },
  {
      name = "MD_KDB_Logger" type = "hf::DebugQueueLogger"
      logclient : { name = "MD_Log_Client"} debug-queue : {name = "MD_KDB_Log_Queue"}
      auto-populate-timestamp = false
  },
  // EUREX MD
