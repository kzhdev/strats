            mem : { shm="PROD" shmname="./shm/min.queue.reject.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.reject.client" } memsize=10000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/min.queue.debug.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.debug.client" } memsize=10000000 }
        }
@else
        request_queue_size = 10000000
        request_entries = 100000

        reply_queue_size = 10000000
        reply_entries = 100000

        reject_queue_size = 10000000
        reject_entries = 100000

        debug_queue_size = 10000000
        debug_entries = 100000
@endif
    },
