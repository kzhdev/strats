        name="rhoneRiskLimits" type="om::RiskLimits" enabled=true
        mem : { shm="PROD" shmname= "./shm/risklimits.cfg" }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
@if __RHONE_API_VERSION__ >= 4
        sc_id=9915007
@endif
        //
@if __RHONE_API_VERSION__ < 4
        request: {
            mem : { shm="PROD" shmname="./shm/min.queue.request.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.request.client" } memsize=10000000 }
        }
        reply: {
            mem : { shm="PROD" shmname="./shm/min.queue.reply.client" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/min.pool.reply.client" } memsize=10000000 }
        }
