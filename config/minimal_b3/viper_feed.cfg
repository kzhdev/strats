@include "config/global.cfg"

resources = (
@include "config/minimal_b3/b3_feed_shared.cfg"
  ,{
      name="MD_Log_Client" type="logging::Client"
      host="localhost" port=30251
  },
  {
      name = "MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
      mem : { shm=true shmname="./shm/vmin.md.kdb.queue" hugetlb=false lock=true numa=-1 }
      qty = 10000 pool={ mem: { shm=true shmname="./shm/vmin.md.kdb.pool" } memsize=10000000 }
      event_mode = true
  },
  {
      name = "MD_KDB_Logger" type = "hf::DebugQueueLogger"
      logclient : { name = "MD_Log_Client"} debug-queue : {name = "MD_KDB_Log_Queue"}
      auto-populate-timestamp = false
  },
  // CME MD
  {
   name="b3" type="B3::MBO::FixFast::MSockets"
   //
   symbols="symbols"
   channels="channels"
   //
   send_implied=true
   queue_position_opts=3
   fillarb_during_poll=true
   //
   md-queues = (
      { name="mdqB3" }
   )
   om-queues = (
      { om="omqCLIENT1" },
   )

   kdb_logger = "MD_KDB_Logger"

   //heartbeatIntervalInMilliseconds=2000

   threads = (
       { method=0 affinity="PROD" cpu=11 policy="FIFO" },
       { method=1 }
   )
   monitor : { enabled=true port=30248 internalTimeoutInSeconds=3000001 }
   mcast : {
       if="MD_IF"
       groups = (
        { enabled=true name="B3_INTEREST_RATE_FUTURES" },
//         { enabled=true name="3" },
        )
   }
 }
)
