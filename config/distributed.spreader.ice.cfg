       request: {
           mem : { shm="PROD" shmname="./shm/hf.omq.request.client224" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.client224" } memsize=10000000 }
       }
       //
       reply: {
           mem : { shm="PROD" shmname="./shm/hf.omq.reply.client224" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.client224" } memsize=10000000 }
       }
       reject: {
           mem : { shm="PROD" shmname="./shm/hf.omq.reject.client224" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.client224" } memsize=10000000 }
       }
       debug: {
           mem : { shm="PROD" shmname="./shm/hf.omq.debug.client224" hugetlb=false lock="PROD" numa=-1 }
           qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.debug.client224" } memsize=10000000 }
       }
   },
    {
        name="frontSide" type="spreader::Frontend"
        //
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" }
        )
        //
        host="corlsd003"
        port=32323
        //
        symbols="symbols"
        //
        md-queues = (
            { name="mdqCME2"}
        )
    },
// PROXY
    {
        name="proxy" type="strat::Proxy" enabled=true
        //
        threads = (
            { method=0 affinity="PROD" cpu=1 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
        )
        //
        admin : { enabled=false port=32179 if=""
            users = (
                { username="admin" password="admin5" role="admin" },
                { username="guest" password="" role="readonly" enabled=false }
            )
        }
        //
        symbols="symbols"
        //
        om-queues = (
            { name="omqCLIENT2" }
        )
        //
        md-queues = (
            { name="mdqCME1" },
            { name="mdqICE" }
        )
        //
        strat="spreaderBackend"
        //
        monitor : { enabled=false }
    },
//STRAT SMS
    {
        name="spreaderBackend" type="spreader::NLegBackend" enabled=true
        front="frontSide"
        spreaderType="Slave"
        venue="ICE"
    }
)
