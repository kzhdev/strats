@include "config/global.cfg"

resources = (
@include "config/minimal_cross_eux_ice/eurex_feed_shared.cfg"
  ,{
      name="MD_Log_Client" type="logging::Client"
      host="localhost" port=30151
  },
  {
      name = "MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
      mem : { shm=true shmname="./shm/vmin.md.ice.kdb.queue" hugetlb=false lock=true numa=-1 }
      qty = 10000 pool={ mem: { shm=true shmname="./shm/vminmd.ice.kdb.pool" } memsize=10000000 }
      event_mode = true
   },
   {
       name = "MD_KDB_Logger" type = "hf::DebugQueueLogger"
       logclient : { name = "MD_Log_Client"} debug-queue : {name = "MD_KDB_Log_Queue"}
       auto-populate-timestamp = false
   },
// ICE MD
  ,{
     name="ice" type="Ice::EndOfEventBook::MSockets"
     //
     symbols="symbols"
     channels="channels"
     //
     send_implied=true
     //
     md-queues = (
        { name="mdqICE" }
     )
     om-queues = (
         { om="omqCLIENT2" }
     )

     kdb_logger = "MD_KDB_Logger"

     //heartbeatIntervalInMilliseconds=2000

     threads = (
         { method=0 affinity="PROD" cpu=19 policy="FIFO" },
         { method=1 }
     )
     monitor : { enabled=true port=30246 internalTimeoutInSeconds=3000001 }
     mcast : {
         if="10.96.52.151"
         groups = (
            { enabled=true name="ICE_Futures_Europe__Liffe__Three_Month_Euro_and_EONIA" }
         )
     }
   }
)
