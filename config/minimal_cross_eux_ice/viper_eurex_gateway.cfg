@include "config/global.cfg"

resources = (
   @include "config/minimal_cross_eux_ice/eurex_feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
    },
     {
         name="omqCLIENTR" type="om::Queues"
         //
         orders="omoCLIENTR"
         sc_id=9915008

         request_queue_size = 10000000
         request_entries = 100000

         reply_queue_size = 10000000
         reply_entries = 100000

         reject_queue_size = 10000000
         reject_entries = 100000

         debug_queue_size = 10000000
         debug_entries = 100000
     },
    // OM GW1
    {
        name="omGW1" type="eurex::om::Gateway" enabled=true id=1
        //
        monitor : { enabled=true port=23139 }
        limits  : {
          enabled=true
          file="./config/minimal_cross_eux_ice/omlimits.csv"
        }
        //
        symbols="symbols"
        //
        @include "config/om-recovery-db.cfg"
        disableResendRequestOnGap  : false
        //
        logclient: { name = "logger" }
        //
        risk_limits: "rhoneRiskLimits"
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )
        // TODO : Eurex Version?
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154" password="password"},
             { trader="Mark" senderSubID="155" password="password"},
             { trader="Steven" senderSubID="156" password="password"},
             { trader="Zhi" senderSubID="157" password="password"}
        )
        //
        risk : { enabled=false host="localhost" port=10107 }
        //
        port : { name="EUREX_HF_TEMP_1" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        sendLegFills=true
        //
        SeqNumMemoryFile : { file="./seqnum/EUREX_HF_TMP_1.seqnum" }
        //
        eurex_specific : { enrichmentRuleID=10, complianceID="12345", partyIDLocationID="US" }

        sliding-throttler : { period=3, orders=145 }
    },
    {
    	name = "threader_1"
    	type = "om::RoundRobinThreadingModel_EUREX"
    	enabled = true

    	threads : (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
    	)


    	components : (
    		{ name = "omGW1" }
    	)
    }
)
