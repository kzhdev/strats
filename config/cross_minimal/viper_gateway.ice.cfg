@include "config/global.cfg"

resources = (
   @include "config/cross_minimal/feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR_ICE" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/vgICER.orders.recovery.client" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENTR_ICE" type="om::Queues"
        //
        orders="omoCLIENTR_ICE"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/vmc_iceR.queue.request.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vmc_iceR.pool.request.recovery" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/vmc_ice.queue.reply.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vmc_ice.pool.reply.recovery" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/vmc_ice.queue.reject.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vmc_ice.pool.reject.recovery" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/vmc_ice.queue.debug.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/vmc_ice.pool.debug.recovery" } memsize=10000000 }
        }
    },
    {
        name="iceRequests" type="om::ICERequests"
        mem : { shm=true shmname="./shm/vmc_ice.requests" hugetlb=false lock="PROD" numa=-1 }
        team_prefix="29"
    },
// OM GW1
    {
        name="omGW1" type="ice::om::GatewayS" enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=14 policy="FIFO" },
            { method=1 affinity="PROD" cpu=15 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )

        requests="iceRequests"

        monitor : { enabled=true port=21748 }
        limits  : { enabled=true file="./config/cross_minimal/omlimits.csv" }

        symbols="symbols"

        om-queues = (
            { name="omqCLIENT2" }, {name="omqCLIENTR_ICE" recovery-client=true }
        )

	    @include "config/om-recovery-db.cfg"

        port : { name="ICE_VIPER_CMIN_01" }

        ports : { name="omPORTS" }

        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        traderOnBehalfOfSubIDMapping = (
            { trader="Taj" onBehalfOfSubID="taj1"},
            { trader="Mark" onBehalfOfSubID="mark"},
            { trader="Steven" onBehalfOfSubID="stev"},
            { trader="Zhi" onBehalfOfSubID="zchen"}
        )

        logclient: { name = "logger" }

        risk_limits: "rhoneRiskLimits"
        sliding-throttler : { period=1, orders=275 }
        sendLegFills=false
        recover-working-orders-fills=true
        keep-gtc-orders=true
        InitialOidFile : { file="./seqnum/initial_oid.ICE_VIPER_CMIN_01.bin" }
        round_trip_limit = 1000
    }
)
