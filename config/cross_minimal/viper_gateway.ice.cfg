@include "config/global.cfg"

resources = (
   @include "config/cross_minimal/feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
// OM GW1
    {
        name="omGW1" type="ice::om::GatewayS" enabled=true

        monitor : { enabled=true }
        limits  : { enabled=true file="./config/cross_minimal/omlimits.csv" }

        symbols="symbols"

        om-queues = (
            { name="omqCLIENT2" }
        )

	    @include "config/om-recovery-db.cfg"

        port : { name="ICE_VCP_BASE_02" }

        ports : { name="omPORTS" }

        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        traderOnBehalfOfSubIDMapping = (
            { trader="Taj" onBehalfOfSubID="taj1"},
            { trader="Mark" onBehalfOfSubID="mark"},
            { trader="Steven" onBehalfOfSubID="stev"},
            { trader="Zhi" onBehalfOfSubID="zchen"}
        )

        logclient: { name = "logger" }

        risk_limits: "rhoneRiskLimits"
        sliding-throttler : { period=1, orders=275 }
        sendLegFills=true
        InitialOidFile : { file="./seqnum/initial_oid.ICE_VIPER_CMIN_01.bin" }
        round_trip_limit = 1000
    },
    {
        name="omGW2" type="ice::om::GatewayS" enabled=true

        monitor : { enabled=true }
        limits  : { enabled=true file="./config/cross_minimal/omlimits.csv" }

        symbols="symbols"

        om-queues = (
            { name="omqCLIENT3" }
        )

        @include "config/om-recovery-db.cfg"

        port : { name="ICE_VIPER_CMIN_02" }

        ports : { name="omPORTS" }

        traders="omTRADERS"
        reconnect = true

        loginRetry : { enabled=true numRetryAttempts=1000000 }

        traderOnBehalfOfSubIDMapping = (
            { trader="Taj" onBehalfOfSubID="taj1"},
            { trader="Mark" onBehalfOfSubID="mark"},
            { trader="Steven" onBehalfOfSubID="stev"},
            { trader="Zhi" onBehalfOfSubID="zchen"}
        )

        logclient: { name = "logger" }

        risk_limits: "rhoneRiskLimits"
        sliding-throttler : { period=1, orders=275 }
        sendLegFills=true
        InitialOidFile : { file="./seqnum/initial_oid.ICE_VIPER_CMIN_02.bin" }
        round_trip_limit = 1000
   },
   {
        name = "threader_icegw"
        type = "om::RoundRobinThreadingModel_ICE"
        enabled = true

        threads : (
            { method=0 affinity="PROD" cpu=11 policy="FIFO" },
            { method=1 affinity="PROD" cpu=9 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )

        components : (
            { name = "omGW1" },
            { name = "omGW2" }
        )
    },
)
