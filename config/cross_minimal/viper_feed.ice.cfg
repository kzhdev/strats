@include "config/global.cfg"

resources = (
@include "config/cross_minimal/feed_shared.cfg"
  ,{
      name="MD_Log_Client" type="logging::Client"
      host="localhost" port=30151
  },
  {
      name = "MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
      mem : { shm=true shmname="./shm/vmin.md.kdb.queue" hugetlb=false lock=true numa=-1 }
      qty = 10000 pool={ mem: { shm=true shmname="./shm/vmin.md.kdb.pool" } memsize=10000000 }
      event_mode = true
  },
  {
      name = "MD_KDB_Logger" type = "hf::DebugQueueLogger"
      logclient : { name = "MD_Log_Client"} debug-queue : {name = "MD_KDB_Log_Queue"}
      auto-populate-timestamp = false
  }
// ICE MD
  ,{
     name="ice" type="Ice::EndOfEventBook::MSockets"
     //name="ice" type="ice::IceSnapshotApiEFVI"
     //
     symbols="symbols"
     channels="channels"
     //
     send_implied=true
     queue_position_opts=3
     fillarb_during_poll=true
     //
     md-queues = (
        { name="mdqICE" }
     )

     //TODO: Make sure this works with both
     om-queues = (
         { om="omqCLIENT2" },
         { om="omqCLIENT3" }
     )

     kdb_logger = "MD_KDB_Logger"

     //heartbeatIntervalInMilliseconds=2000

     threads = (
         { method=0 affinity="PROD" cpu=19 policy="FIFO" },
         { method=1 }
     )
     monitor : { enabled=true port=31546 internalTimeoutInSeconds=3000001 }
     mcast : {
         if="MD_IF"
         groups = (
            { enabled=true name="ICE_Futures_Brent" }, // BRN
            { enabled=true name="ICE_Futures_WTI" }, // WTI
            { enabled=false name="ICE_Futures_Europe_Oil_Others" },
            { enabled=false name="ICE_Futures_Brent_Full_Implied" }
            )
         }
   }
)
