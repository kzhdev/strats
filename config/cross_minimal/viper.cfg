@include "config/global.cfg"

resources = (
   @include "config/cross_minimal/feed_shared.cfg"

   // EXE KDB Logger, likely unused
   ,{
       name="EXE_Log_Client" type="logging::Client"
       host="localhost" port=30151
   },
   {
       name = "EXE_KDB_Log_Queue" type = "hf::queue::DebugQueue"
       mem : { shm=true shmname="./shm/EXE_KDB_Log_Queue.queue" hugetlb=false lock=true numa=-1 }
       qty = 10000 pool={ mem: { shm=true shmname="./shm/EXE_KDB_Log_Queue.pool" } memsize=10000000 }
       event_mode = true
       symbols = "symbols"
   },
   {
       name = "EXE_KDB_Logger" type = "hf::DebugQueueLogger"
       logclient : { name = "EXE_Log_Client"} debug-queue : {name = "EXE_KDB_Log_Queue"}
       auto-populate-timestamp = false
   },
   // Frontside kdb_logger
   {
      name="FS_Log_Client" type="logging::Client"
      host="localhost" port=30151
   },
   {
       name = "FS_KDB_Log_Queue" type = "hf::queue::DebugQueue"
       mem : { shm=true shmname="./shm/FS_KDB_Log_Queue.queue" hugetlb=false lock=true numa=-1 }
       qty = 10000 pool={ mem: { shm=true shmname="./shm/FS_KDB_Log_Queue.pool" } memsize=10000000 }
       event_mode = true
       symbols = "symbols"
   },
   {
       name = "FS_KDB_Logger" type = "hf::DebugQueueLogger"
       logclient : { name = "FS_Log_Client"} debug-queue : {name = "FS_KDB_Log_Queue"}
       auto-populate-timestamp = false
   },
   //Viper Queues
   {
       name="ViperLoggerQueue" type="hf::queue::ViperLoggerQueue"
       shname="./shm/viper_log_queue.queue"
   },
   //Begin Main Strategy Config
   {
       name="RelativeValue" type="RelativeValue"
       threads = (
           { method=0 affinity="PROD" cpu=18 policy="FIFO" }
       )
   },
   {
       name="MarketMaker" type="MarketMaker"

       threads = (
           { method=0 affinity="PROD" cpu=21 policy="FIFO" }
       )
   },
   {
       name="FrontSide" type="FrontSide"

       threads = (
           { method=0 affinity="PROD" cpu=19 policy="FIFO" }
       )

       host="corlsd005"
       port=30152

       symbols="symbols"

       config_file = "./config/cross_minimal/model.smallcross.csv"
       rv_pos_file = "./config/cross_minimal/rv_pos.csv"
       mm_last_fill_price_file = "./config/cross_minimal/mm_last_fill_price_file.csv"

       internal_heartbeat = 1000000
       send_gui_heartbeat_interval_in_ms = 900;

       allowGTCs = true
       allowStatusGrid = true;

       transaction_capacity = (
         { venue="ICE" value=275 },
         { venue="CME" value=500 }
       )

       iid=300072

       ice_cancel_resting = true

       kdb_logger = "FS_KDB_Logger"
    },
    {
        name="Viper" type="Executor" enabled=true

        md-queues = (
            { name="cme_mdq" id=15 enabled=true},
            { name="mdqICE" id=14 enabled=true}
        )

        strategy_name = "manual.strat"
        strategy_version = "1"

        kdb_logger = "EXE_KDB_Logger"
    },
    {
        name="proxy" type="strat::Proxy" enabled=true id=9915003

        threads = (
            { method=0 affinity="PROD" cpu=20 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
        )

        symbols="symbols"

        om-queues = (
             { name="omqCLIENT1" enabled=true },
             { name="omqCLIENT2" enabled=true }
        )

        md-queues = (
            { name="cme_mdq" id=15 enabled=true},
            { name="mdqICE" id=14 enabled=true}
        )

        risk_limits: "rhoneRiskLimits"
        admin : { enabled=true port=47811 if=""
           users = (
               { username="admin" password="admin5" role="admin" },
               { username="guest" password="" role="readonly"  enabled=false }
           )

           enable_heartbeat=true
           heartbeat=10
           max_missed_heartbeats=10
        }

        monitor : { enabled=true }

        strat="Viper"
    }
)
