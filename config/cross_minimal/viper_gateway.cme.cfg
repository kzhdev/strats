@include "config/global.cfg"

resources = (
   @include "config/cross_minimal/feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR_CME" type="om::Orders" id="recovery"
        mem : { shm="PROD" shmname="./shm/vgcmeR.orders.recovery.client" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENTR_CME" type="om::Queues"
        //
        sc_id=9915003
        //
        orders="omoCLIENTR_CME"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/vmc_cme.queue.request.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vmc_cme.pool.request.recovery" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/vmc_cme.queue.reply.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vmc_cme.pool.reply.recovery" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/vmc_cme.queue.reject.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/vmc_cme.pool.reject.recovery" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/vmc_cme.queue.debug.recovery" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/vmc_cme.pool.debug.recovery" } memsize=10000000 }
        }
    },
    // OM GW1
    {
        name="omGW1" type="cme::om::GatewayS" enabled=true id=1
        threads = (
            { method=0 affinity="PROD" cpu=12 policy="FIFO" },
            { method=1 affinity="PROD" cpu=13 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        monitor : { enabled=true port=23138 }
        limits  : { enabled=true file="./config/cross_minimal/omlimits.csv" }
        //
        symbols="symbols"
        //
        @include "config/om-recovery-db.cfg"
        recover-working-orders-fills : true
        disableResendRequestOnGap  : false
        keep-gtc-orders : true
        //
        logclient: { name = "logger" }
        //
        risk_limits: "rhoneRiskLimits"
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR_CME" recovery-client=true }
        )
        //
        ctiCodeOverride = (
            { pattern="CL.*" ctiCode="4" },
            { pattern="GE.*" ctiCode="4" }
        )
        //
        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )
        //
        risk : { enabled=false host="localhost" port=10107 }
        //
        port : { name="CME_VIPER_CMIN_01" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        sendLegFills=true
        //
        msgwConfigXML="./config/cross_minimal/MSGW_Config.xml"
        msgwPrimaryOrBackup = "primary"
        //
        reconnectTimeoutSeconds = 5
        //
        SeqNumMemoryFile : { file="./seqnum/CME_VIPER_CMIN_01.seqnum" }

        sliding-throttler : { period=3, orders=1400 }
    },
    {
        name = "threader_cmegw"
        type = "om::RoundRobinThreadingModel_CME"
        enabled = true

        threads : (
            { method=0 affinity="PROD" cpu=11 policy="FIFO" },
            { method=1 affinity="PROD" cpu=9 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )

        components : (
            { name = "omGW1" },
        )
    },
)
