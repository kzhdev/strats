    @include "config/minimal/ice_feed_shared.cfg"

    {
        name="proxy" type="strat::Proxy" enabled=true id=9915004 //id=9915006

        threads = (
            { method=0 affinity="PROD" cpu=20 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
