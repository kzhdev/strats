
@include "config/global.cfg"

resources = (
    {
        name="symbols" type="md::Symbols"
        mem : { shm="PROD" shmname="./shm/hf.md.symbols.paul1" hugetlb=false lock="PROD" numa=-1 }
        file="./config/secdb.cme.small.csv"
    },
    {
        name="mdpCME1" type="md::Pool"
        mem : { shm="PROD" shmname="hf.mdp.eurex.paul1" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
    {
        name="mdqCME1" type="md::Queue"
        mem : { shm="PROD" shmname="./shm/hf.mdq.cme.paul1" hugetlb=false lock="PROD" numa=-1 }
        //qty=100000 pool="mdpCME1"
        qty=1000000 pool="mdpCME1"
    },
    {
        name="channels" type="md::ChannelInfoResource"
        //
        file="./config/mdchannels.cme.cert.csv"
    },
    {
        name="cmeRequests" type="om::CMERequests"
        //
        mem : { shm="PROD" shmname="./shm/hf.omp.cmeRequests.gw1.paul1" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
// POSITION PERSISTENCE
    {
        name="positionPersisterService" type="oms::PositionPersisterService" enabled=true
        thread : { }
        mem : {
            pool  : { qty=65 shm="false" shmname="./shm/hf.positionPersister.paul1.pool"  }
            queue : { qty=65 shm="false" shmname="./shm/hf.positionPersister.paul1.queue" }
        }
    },
// CME MD MULTIPLE RECEIVER
    {
        //name="cme" type="cme::mdp::CMEHandlerEPOLL" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        name="cme" type="cme::mdp::CMEHandlerEPOLLWithSnapshot" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        //
        symbols="symbols"
        //
        channels="channels"
        //
        heartbeatIntervalInMilliseconds=1000
        //
        md-queues = (
            { name="mdqCME1" }
        )
        //
        threads = (
            { method=0 affinity="PROD" cpu=16 policy="FIFO" },
            { method=1 }
            )
        monitor : { enabled=true port=20607 internalTimeoutInSeconds=31 }
        mcast : {
            if="MD_IF" onload_filter=false
            groups = (
                { name="310" enabled=true},
                { name="312" enabled=true},
                { name="314" enabled=true},
                { name="316" enabled=true},
                { name="318" enabled=true},
                { name="320" enabled=true},
                { name="340" enabled=true},
                { name="342" enabled=true},
                { name="344" enabled=true},
                { name="346" enabled=true},
                { name="360" enabled=true},
                { name="380" enabled=true},
                { name="382" enabled=true},
                { name="384" enabled=true},
                { name="386" enabled=true},
                { name="410" enabled=true},
                { name="430" enabled=true},
                { name="440" enabled=true},
                { name="450" enabled=true},
                { name="460" enabled=true},
                { name="510" enabled=true},
                { name="520" enabled=true}
            )
        }
    },
// OM
    {
        name="omTRADERS" type="om::Traders"
    },
    {
        name="omPORTS" type="om::Ports"
        //
        mem : { shm="PROD" shmname="./shm/hf.om.paul1.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/omports.csv"
    },
// OM GW1
    {
        name="omGW1" type="cme::om::GatewayOms" enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 affinity="PROD" cpu=3 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        monitor : { enabled=true port=19609 }
        limits  : { enabled=true file="./config/omlimits.csv" }
        //
        requests="cmeRequests"
        //
        symbols="symbols"
        //
        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb : { enabled=true async=false host="localhost" port=31427 table="omX"}
            kdb-om : { enabled=true async=false host="localhost" port=31427 table="omX"}
        }
        //
        keep-gtc-orders = true
        @include "./config/om-recovery-db.cfg"
        //
        om-queues = (
            { name="omqCLIENT1" },  {name="omqCLIENTR" recovery-client=true }
        )
        //
        sliding-throttler : { period=3 orders=125 }
        //
        port : { name="CME_1C2" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        nanosRoundtripLimit=10
        loginRetry : { enabled=false }
        //
        SeqNumMemoryFile : { file="./seqnum/CME_PAUL.seqnum" }
    },
// CLIENT OM
    {
        name="omoCLIENT1" type="om::Orders"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo..paul1.client1" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/hf.omq.request.paul1.client1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.paul1.client1" } memsize=10000000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reply.paul1.client1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.paul1.client1" } memsize=10000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.client1" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.paul1.client1" } memsize=10000000 }
        }
    },
// RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.paul1.clientR" hugetlb=false lock="PROD" numa=-1 }
        //
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        //
        request: {
        mem : { shm="PROD" shmname="./shm/hf.omq.request.paul1.clientR" hugetlb=false lock="PROD" numa=-1 }
        qty=10000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.paul1.clientR" } memsize=1000000 }
        }
        //
        reply: {
        mem : { shm="PROD" shmname="./shm/hf.omq.reply.paul1.clientR" hugetlb=false lock="PROD" numa=-1 }
        qty=10000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.paul1.clientR" } memsize=1000000 }
        }
        reject: {
        mem : { shm="PROD" shmname="./shm/hf.omq.reject.clientR" hugetlb=false lock="PROD" numa=-1 }
        qty=10000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.paul1.clientR" } memsize=1000000 }
        }
    },
// PROXY
    {
        name="proxy" type="strat::Proxy" id=2100 enabled=true
        //
        threads = (
            { method=0 affinity="PROD" cpu=1 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
        )
        //
        admin : { enabled=true port=32179 if=""
            users = (
                { username="admin" password="admin5" role="admin" },
                { username="guest" password="" role="readonly" enabled=false }
            )
        }
        //
        symbols="symbols"
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        md-queues = (
            { name="mdqCME1" }
        )
        monitor = {enabled=false}
        traders="omTRADERS"
        //
        strat="sms1"
    },
