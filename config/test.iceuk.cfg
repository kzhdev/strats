
@include "config/global.cfg"

resources = (
    {
        name="symbols" type="md::Symbols"
        mem : { shm="PROD" shmname="./shm/hf.md.symbols.iceuk" hugetlb=false lock="PROD" numa=-1 }
        file="./config/secdb.iceus.cert.small.csv"
    },
    {
        name="mdpICE1" type="md::Pool"
        mem : { shm="PROD" shmname="hf.mdp.ice.oms.iceuk" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
    {
        name="mdqICE1" type="md::Queue"
        mem : { shm="PROD" shmname="./shm/hf.mdq.ice.oms.iceuk" hugetlb=false lock="PROD" numa=-1 }
        qty=1000000 pool="mdpICE1"
    },
    {
        name="channels" type="md::ChannelInfoResource"
        //
        file="./config/mdchannels.ice.cert.csv"
    },
    {
        name="iceRequests" type="om::ICERequests"
        //
        mem : { shm="PROD" shmname="./shm/hf.omp.iceRequests.gw1.iceuk" hugetlb=false lock="PROD" numa=-1 }
        team_prefix="22"
        memsize=100000000
    },
// LOGGING
    {
        name="logger" type="logging::Client"
        port=23985
    },
// POSITION PERSISTENCE
    {
        name="positionPersisterService" type="oms::PositionPersisterService" enabled=true
        thread : { }
        mem : {
            pool  : { qty=65 shm="false" shmname="./shm/hf.positionPersister.pool.iceuk"  }
            queue : { qty=65 shm="false" shmname="./shm/hf.positionPersister.queue.iceuk" }
        }
    },
// ICE MD MULTIPLE RECEIVER
    {
       name="ice" type="ice::ICEFodSnapshotHandlerMultiple" enabled=true
       //
       symbols="symbols"
       channels="channels"
       //
       send_implied=true
       //
       md-queues = (
          { name="mdqICE1" }
       )
       threads = (
           { method=0 affinity="PROD" cpu=16 policy="FIFO" },
           { method=1 }
       )
       monitor : { enabled=true port=30119 internalTimeoutInSeconds=31 }
       mcast : {
           if="MD_IF"
           groups = (
              { enabled=false name="ICE_Futures_Brent" },
              { enabled=false name="ICE_Futures_WTI" },
              { enabled=false name="ICE_Futures_US_Financials" },
              { enabled=false name="ICE_Futures_US_Agricultures" }
              )
           }
     },
// OM
    {
        name="omTRADERS" type="om::Traders"
    },
    {
        name="omPORTS" type="om::Ports"
        //
        mem : { shm="PROD" shmname="./shm/hf.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/omports.csv"
    },
// CLIENT OM
    {
        name="omoCLIENT1" type="om::Orders"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.ice.client1.iceuk" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/hf.omq.request.ice.client1._iceuk" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.ice.client1._iceuk" } memsize=10000000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reply.ice.client1._iceuk" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.ice.client1._iceuk" } memsize=10000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.ice.client1.aef" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.ice.client1.aef" } memsize=10000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/hf.omq.debug.client1_iceuk" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.debug.efihqef" } memsize=10000000 }
        }
    },
    // RECOVERY-CLIENT OM
    {
        name="omoCLIENTR" type="om::Orders" id="recovery"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.ice.clientR.iceuk.aef" hugetlb=false lock="PROD" numa=-1 }
        //
    },
    {
        name="omqCLIENTR" type="om::Queues"
        //
        orders="omoCLIENTR"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/hf.omq.ice.request.clientR_.iceuk" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.clientR.iceuk" } memsize=10000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/hf.omq.ice.reply.clientR_.iceuk" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.clientR.iceuk" } memsize=10000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/hf.omq.ice.reject.clientR_.iceuk" hugetlb=false lock="PROD" numa=-1 }
            qty=100 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.clientR.iceuk" } memsize=10000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/hf.omq.debug.client1.aefad" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.debug.clientR.iceuk.aqedf" } memsize=10000000 }
        }
    },
// OM GW1
    {
        name="omGW1" type="ice::om::IceGatewayOms" enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 affinity="PROD" cpu=3 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        requests="iceRequests"
        //
        monitor : { enabled=true port=50237 }
        limits  : { enabled=true file="./config/omlimits.csv" }
        //
        symbols="symbols"
        //
        logclient : { name = "logger" }
        //
        log : {
            kdb: { enabled=true async=false host="localhost" port=31427 table="omX" }
        }
        //
        om-queues = (
            { name="omqCLIENT1" }, {name="omqCLIENTR" recovery-client=true }
        )
        //
        risk : { enabled=false host="localhost" port=10107 }
        //
        port : { name="ICE_OS4" }
        //
        ports : { name="omPORTS" }
        //
        traders="omTRADERS"
        //
        //reconnect = false
        //
        sliding-throttler : { period=1, orders=100 }
        sendLegFills=true
        recover-working-orders-fills : true
        @include "config/om-recovery-db.cfg"
        SeqNumMemoryFile : { file="./seqnum/ICE_OS4.seqnum" }
    },
// PROXY
    {
        name="proxy" type="strat::Proxy" enabled=true id=39100
        //
        threads = (
            { method=0 affinity="PROD" cpu=1 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
        )
        //
        admin : { enabled=true port=32179 if=""
            users = (
                { username="admin" password="admin5" role="admin" },
                { username="guest" password="" role="readonly" enabled=false }
            )
        }
        //
        symbols="symbols"
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        md-queues = (
            { name="mdqICE1" }
        )
        monitor = {enabled=false}
        //
        traders="omTRADERS"
        //
        strat="sms1"
    },
//STRAT SMS
    {
        name="sms1" type="oms::OrderServerStrategy" enabled=true
	    venue="ICE" silo="ICEUK"
	    positionPersisterService="positionPersisterService"

	    clientsAcceptor : { host="corlsd003" port=21281 } //Charles
        database : { server="CORWDP002\\GT_CRX_D_US" defaultDatabase="PermissionedProperties" useSqlAuthentication=false
                     userName="gsrisk" password="gsrisk" storedProcedureAuthenticationUsername="cmilutinovic"}
        mdtimeout : { defaultTimeoutInMilliseconds=32000 }

        //exists on corlsd003, big enough that I don't want to check it in.  The above below works, but is slow
        settlePrices : { serviceQuery = "./config/ice_settlement_prices_small.csv" }
        //settlePrices : { serviceQuery = "http://refdata-dev.service.genevatrading.com/instruments/?query=SecurityType:FUT&field=SecurityID&field=SecurityID&field=TradingReferencePrice&field=TradingReferenceDate&field=Symbol" }
        //client_heartbeats : { heartbeatIntervalInMilliseconds=1000 enabled=true }
    }
    // DEATH
    //,
    //{
    //        name="endProcessOnRun" type="config::StopAllOnRunService" thread : { }
    //}
)
