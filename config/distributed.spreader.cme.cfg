
@include "config/global.cfg"

resources = (
    {
        name="symbols" type="md::Symbols"
        mem : { shm="PROD" shmname="./shm/hf.md.symbols" hugetlb=false lock="PROD" numa=-1 }
        file="./config/spreader.dev.secdb.csv"
    },
    {
        name="mdpCME1" type="md::Pool"
        mem : { shm="PROD" shmname="hf.mdp.eurex" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
    {
        name="mdqCME1" type="md::Queue"
        mem : { shm="PROD" shmname="./shm/hf.mdq.cme" hugetlb=false lock="PROD" numa=-1 }
        qty=1000000 pool="mdpCME1"
    },
    {
        name="mdqCME2" type="md::Queue"
        mem : { shm="PROD" shmname="./shm/hf.mdq2.cme2" hugetlb=false lock="PROD" numa=-1 }
        qty=1000000 pool="mdpCME1"
    },
    {
        name="channels" type="md::ChannelInfoResource"
        //
        file="./config/channels.cert.csv"
    },
    {
        name="cmeRequests" type="om::CMERequests"
        //
        mem : { shm="PROD" shmname="./shm/hf.omp.cmeRequests.gw1" hugetlb=false lock="PROD" numa=-1 }
        memsize=100000000
    },
// CME MD MULTIPLE RECEIVER
    {
        //name="cme" type="cme::mdp::CMEHandlerEPOLL" create_priority=1 postcreate_priority=1 start_priority=1 enabled=false
        name="cme" type="cme::mdp::CMEHandlerEPOLLWithSnapshot" create_priority=1 postcreate_priority=1 start_priority=1 enabled=true
        //
        symbols="symbols"
        //
        channels="channels"
        //
        heartbeatIntervalInMilliseconds=1000
        //
        md-queues = (
            { name="mdqCME1"},
            { name="mdqCME2"}
        )
        //
        threads = (

            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 }
        )
        monitor : { enabled=true port=20656 internalTimeoutInSeconds=31 }
        mcast : {
            if="MD_IF" onload_filter=false
            groups = (
                { name="310" enabled=true},
                { name="312" enabled=false},
                { name="314" enabled=false},
                { name="316" enabled=false},
                { name="318" enabled=true},
                { name="320" enabled=false},
                { name="340" enabled=false},
                { name="342" enabled=false},
                { name="344" enabled=false},
                { name="346" enabled=false},
                { name="360" enabled=false},
                { name="380" enabled=false},
                { name="382" enabled=true},
                { name="384" enabled=false},
                { name="386" enabled=false},
                { name="410" enabled=false},
                { name="430" enabled=false},
                { name="440" enabled=false},
                { name="450" enabled=false},
                { name="460" enabled=false},
                { name="510" enabled=false},
                { name="520" enabled=false}
            )
        }
    },
    // ICE POOL
       {
          name="mdpICE" type="md::Pool"
          mem : { shm="PROD" shmname="hf.mdp.ice" hugetlb=false lock="PROD" numa=-1 }
          memsize=100000000
      },
      {
          name="mdqICE" type="md::Queue"
          mem : { shm="PROD" shmname="./shm/hf.mdq.ice" hugetlb=false lock="PROD" numa=-1 }
          qty=100000 pool="mdpICE"
      },
    // ICE MD
      {
         name="ice" type="ice::ICEFodBookSnapshotHandlerMultiple" enabled=true
         //
         symbols="symbols"
         channels="channels"
         //
         send_implied=true
         //
         md-queues = (
            { name="mdqICE" }
         )
         //
         //heartbeatIntervalInMilliseconds=2000
         //
         threads = (
             { method=0 affinity="PROD" cpu=16 policy="FIFO" },
             { method=1 }
         )
         monitor : { enabled=true port=30112 internalTimeoutInSeconds=31 }
         mcast : {
             if="MD_IF"
             groups = (
              //  { enabled=true name="ICE_Futures_Brent" } // BRN
                { enabled=true name="ICE_Futures_WTI" } // WTI
            //    { enabled=true name="ICE_Futures_Europe_Oil_Others" },
             //   { enabled=true name="ICE_Futures_Brent_Full_Implied" }
                )
             }
       },
// OM
    {
        name="omTRADERS" type="om::Traders"
    },
    {
        name="omPORTS" type="om::Ports"
        //
        mem : { shm="PROD" shmname="./shm/hf.om.ports" hugetlb=false lock="PROD" numa=-1 }
        file="./config/omports.csv"
    },
// OM GW1
    {
        name="omGW1" type="cme::om::GatewayS" enabled=true
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" },
            { method=1 affinity="PROD" cpu=3 policy="FIFO" },
            { method=2 },
            { method=3 },
            { method=4 }
        )
        //
        monitor : { enabled=false port=19609 }
        limits  : { enabled=true file="./config/spreader.dev.omlimits.csv" }
        //
        requests="cmeRequests"
        //
        symbols="symbols"
        //
        log : {
            mcast : { enabled=false addr="239.10.80.215" port=10404 if="" ttl=0}
            kdb : { enabled=true async=false host="localhost" port=45679 table="omX"}
        }
        recover-working-orders-fills=false
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        sliding-throttler : { period=3 orders=125 }
        //
        //risk : { enabled=false host="localhost" port=10107 }
        //
        //port : { name="CME_B17" }
        //port : { name="CME_1B3" }
        port : { name="CME_1H0" }
        ports : { name="omPORTS" }
        traders="omTRADERS"
        nanosRoundtripLimit=10
        loginRetry : { enabled=false }
        disableResendRequestOnGap = true
    },
// CLIENT OM
    {
        name="omoCLIENT1" type="om::Orders"
        //
        mem : { shm="PROD" shmname="./shm/hf.omo.client1" hugetlb=false lock="PROD" numa=-1 }
    },
    {
        name="omqCLIENT1" type="om::Queues"
        //
        orders="omoCLIENT1"
        //
        request: {
            mem : { shm="PROD" shmname="./shm/hf.omq.request.client124" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.request.client124" } memsize=10000000 }
        }
        //
        reply: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reply.client124" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reply.client124" } memsize=10000000 }
        }
        reject: {
            mem : { shm="PROD" shmname="./shm/hf.omq.reject.client124" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.reject.client124" } memsize=10000000 }
        }
        debug: {
            mem : { shm="PROD" shmname="./shm/hf.omq.debug.client124" hugetlb=false lock="PROD" numa=-1 }
            qty=100000 pool={ mem: { shm="PROD" shmname="./shm/hf.omp.debug.client124" } memsize=10000000 }
        }
    },
    {
        name="frontSide" type="spreader::Frontend"
        //
        threads = (
            { method=0 affinity="PROD" cpu=2 policy="FIFO" }
        )
        //
        host="corlsd003"
        port=23232
        //
        symbols="symbols"
        //
        md-queues = (
            { name="mdqCME2"}
        )
    },
// PROXY
    {
        name="proxy" type="strat::Proxy" enabled=true
        //
        threads = (
            { method=0 affinity="PROD" cpu=1 policy="FIFO" },
            { method=1 }, // TIMER
            { method=2 }, // ADMIN
            { method=3 } // MONITOR
        )
        //
        admin : { enabled=false port=32179 if=""
            users = (
                { username="admin" password="admin5" role="admin" },
                { username="guest" password="" role="readonly" enabled=false }
            )
        }
        //
        symbols="symbols"
        //
        om-queues = (
            { name="omqCLIENT1" }
        )
        //
        md-queues = (
            { name="mdqCME1" },
            { name="mdqICE" }
        )
        //
        strat="spreaderBackend"
        //
        monitor : { enabled=false }
    },
//STRAT SMS
    {
        name="spreaderBackend" type="spreader::NLegBackend" enabled=true
        front="frontSide"
        spreaderType="Master"
        slave: {host="localhost" port=32323 netIF="ens1f0"}
        venue="CME"
    }
)
