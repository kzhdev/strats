@include "config/global.cfg"

resources = (
@include "config/minimal_cme/cme_feed_shared.cfg"
  ,{
      name="MD_Log_Client" type="logging::Client"
      host="localhost" port=30151
  },
  {
      name = "MD_KDB_Log_Queue" type = "hf::queue::DebugQueue"
      mem : { shm=true shmname="./shm/vmin.md.kdb.queue" hugetlb=false lock=true numa=-1 }
      qty = 10000 pool={ mem: { shm=true shmname="./shm/vmin.md.kdb.pool" } memsize=10000000 }
      event_mode = true
  },
  {
      name = "MD_KDB_Logger" type = "hf::DebugQueueLogger"
      logclient : { name = "MD_Log_Client"} debug-queue : {name = "MD_KDB_Log_Queue"}
      auto-populate-timestamp = false
  },
  // CME MD
  {
   name="cme" type="Cme::MBO::EndOfEventBookWithFAKRemoval"
   //
   symbols="symbols"
   channels="channels"
   //
   send_implied=true
   //
   md-queues = (
      { name="mdqCME" }
   )
   om-queues = (
      { om="omqCLIENT1" },
      { om="omqCLIENT2" },
      { om="omqCLIENT3" }
   )

   kdb_logger = "MD_KDB_Logger"

   //heartbeatIntervalInMilliseconds=2000

   threads = (
       { method=0 affinity="PROD" cpu=11 policy="FIFO" },
       { method=1 }
   )
   monitor : { enabled=true port=45622 }
   mcast : {
       if="MD_IF"
       efvi_if="ens1f1"
       groups = (
        { enabled=true name="310" },
        { enabled=true name="312" },
        { enabled=true name="314" },
        { enabled=true name="316" },
        { enabled=true name="318" },
        { enabled=true name="320" },
        { enabled=true name="340" },
        { enabled=true name="342" },
        { enabled=true name="344" },
        { enabled=true name="346" },
        { enabled=true name="348" },
        { enabled=true name="360" },
        { enabled=true name="382" },
        { enabled=true name="384" },
        { enabled=true name="386" },
        { enabled=true name="440" },
        { enabled=true name="460" }
        )
   }
 }
)
