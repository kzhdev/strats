@include "config/global.cfg"

resources = (
   @include "config/minimal_cme_2/cme_feed_shared.cfg"
   // LOGGING
     ,{
             name="logger" type="logging::Client"
             port=30151
     },
    // OM GW1
    {
        name="omGW1" type="cme::om::GatewayS" enabled=true id=1

        limits  : { enabled=true file="./config/minimal_cme_2/omlimits.csv" }

        symbols="symbols"

        sliding-throttler : { period=3, orders=1400 }

        port : { name="CME_MRQ_80" }
        ports : { name="omPORTS" }

        om-queues = (
            { name="omqCLIENT1" }
        )

        traderSenderSubIDMapping = (
             { trader="Taj" senderSubID="154N" location="US,IL"},
             { trader="Mark" senderSubID="154B" location="US,IL"},
             { trader="Steven" senderSubID="154A" location="US,IL"},
             { trader="Zhi" senderSubID="FA64" location="US,IL"}
        )

        ctiCodeOverride = (
            { pattern="CL.*" ctiCode="4" },
            { pattern="GE.*" ctiCode="4" }
        )

        logclient: { name = "logger" }
        traders="omTRADERS"
        loginRetry : { enabled=true }
        //reconnectTimeoutSeconds = 20
        risk_limits: "rhoneRiskLimits"

        msgwConfigXML="./config/minimal_cme_2/MSGW_Config.xml"
        msgwPrimaryOrBackup = "primary"
        round_trip_limit = 10

        //GTC
        @include "config/om-recovery-db.cfg"
        disableResendRequestOnGap  : false
        SeqNumMemoryFile : { file="./seqnum/CME_MRQ_82.cme2.seqnum" }
    },
    {
        name="myLittleThreader" type="om::RoundRobinThreadingModel_CME" enabled=true
        threads : (
           { method=0 affinity=true cpu=10 policy="FIFO" }, // "Send" thread; Strategy => Exchange
           { method=1 affinity=true cpu=11 policy="FIFO" },  //"Read" thread; Exchange => Strategy
           { method=2 affinity=false } //Monitor thread
        )
        components : (
            { name="omGW1" }
        )
    }
)
