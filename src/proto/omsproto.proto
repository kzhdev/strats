syntax = "proto2";
package Python.proto;
enum PROTOCOL_VERSION {
    VERSION = 1;
}
enum VENUE {
    VENUE_UNKNOWN = 0;
    VENUE_CME = 1;
    VENUE_ICE = 2;
    VENUE_EUREX = 3;
}

enum GUI_MESSAGE_TYPE {
    GUI_MESSAGE_TYPE_CLIENT_LOGIN = 1;
    GUI_MESSAGE_TYPE_CLIENT_LOGOUT = 2;
    GUI_MESSAGE_TYPE_GRID_CHANGE = 3;
    GUI_MESSAGE_TYPE_HEARTBEAT = 4;
    GUI_MESSAGE_TYPE_GRID_INITIALIZATION_ACCEPTED = 5;
    GUI_MESSAGE_TYPE_GRID_INITIALIZATION_REJECTED = 6;
    GUI_MESSAGE_TYPE_HARD_SHUTDOWN = 7;
    GUI_MESSAGE_TYPE_ENABLE_TRADE = 8;
    GUI_MESSAGE_TYPE_DISABLE_TRADE = 9;
    GUI_MESSAGE_TYPE_SWITCH = 10;
}

enum SERVER_MESSAGE_TYPE {
    SERVER_MESSAGE_TYPE_CLIENT_CONNECTED = 30;
    SERVER_MESSAGE_TYPE_CLIENT_REJECTED = 31;
    SERVER_MESSAGE_TYPE_CLIENT_CLOSED = 32;
    SERVER_MESSAGE_TYPE_CLIENT_CLOSE_REJECTED = 33;
    SERVER_MESSAGE_TYPE_HEARTBEAT = 34;
    SERVER_MESSAGE_TYPE_GRID_CHANGE_ACCEPTED = 35;
    SERVER_MESSAGE_TYPE_GRID_CHANGE_REJECTED = 36;
    SERVER_MESSAGE_TYPE_GRID_INITIALIZATION = 37;
    SERVER_MESSAGE_TYPE_GRID_STATE_CHANGE = 38;
    SERVER_MESSAGE_TYPE_SWITCH_ACCEPTED = 39;
    SERVER_MESSAGE_TYPE_SWITCH_REJECTED = 40;
    SERVER_MESSAGE_TYPE_FORMAT_ERROR = 41;
}

enum ERROR_CODE {
    ERROR_CODE_DECODE_MESSAGE_ERROR = -1;
    ERROR_CODE_WRONG_PROTOCOL_VERSION = -2;
    ERROR_CODE_CLIENT_IS_ALREADY_LOGGED_IN = -3;
    ERROR_CODE_INCORRECT_USERNAME = -4;
    ERROR_CODE_CLIENT_IS_NOT_LOGGED_IN = -5;
    ERROR_CODE_GATEWAY_DOWN = -6;
    ERROR_CODE_TRADER_IS_CLOSED_OR_CLOSING = -7;
}

message Error {
    optional ERROR_CODE errorCode = 1;
    optional string errorText = 2;
}

message ClientLogin {
	required uint32 messageID = 1;
    required string userName = 2;
    optional string version = 3;
}

message ErrorMessage {
	required uint32 messageID = 1;
	required Error error = 2;
}

message ClientConnected {
    required uint32 messageID = 1;
    required string version = 2;
}

message ClientClosed {
    required uint32 messageID = 1;
}

message GridCell {
    required uint32 row = 1;
    required uint32 col = 2;
    required string value = 3;
}

message GridUpdate {
	required uint32 messageID = 1;
    repeated GridCell cells = 2;
    required uint32 gridId = 3;
}

message HeaderCell {
    required string label = 1;
    required uint32 id = 2;
}

message GridInitialization {
	required uint32 messageID = 1;
	repeated HeaderCell rowHeader = 2;
	repeated HeaderCell columnHeader = 3;
    repeated GridCell cells = 4;
    required uint32 gridId = 5;
}

message Switch {
    required uint32 messageID = 1;
    required uint32 windowId = 2;
    required uint32 id = 3;
    required bool on = 4;
}
