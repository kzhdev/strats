syntax = "proto2";
package Python.proto;
enum PROTOCOL_VERSION {
    VERSION = 1;
}
enum VENUE {
    VENUE_UNKNOWN = 0;
    VENUE_CME = 1;
    VENUE_ICE = 2;
    VENUE_EUREX = 3;
}

enum GUI_MESSAGE_TYPE {
    GUI_MESSAGE_TYPE_CLIENT_LOGIN = 1;
    GUI_MESSAGE_TYPE_CLIENT_LOGOUT = 2;
    GUI_MESSAGE_TYPE_GRID_CHANGE = 3;
    GUI_MESSAGE_TYPE_HEARTBEAT = 4;
    GUI_MESSAGE_TYPE_GUI_INITIALIZATION_ACCEPTED = 5;
    GUI_MESSAGE_TYPE_GUI_INITIALIZATION_REJECTED = 6;
    GUI_MESSAGE_TYPE_SYSTEM_STATE_CHANGE = 7;
    GUI_MESSAGE_TYPE_SWITCH_CHANGE = 8;
}

enum SERVER_MESSAGE_TYPE {
    SERVER_MESSAGE_TYPE_CLIENT_CONNECTED = 30;
    SERVER_MESSAGE_TYPE_CLIENT_REJECTED = 31;
    SERVER_MESSAGE_TYPE_CLIENT_CLOSED = 32;
    SERVER_MESSAGE_TYPE_CLIENT_CLOSE_REJECTED = 33;
    SERVER_MESSAGE_TYPE_HEARTBEAT = 34;
    SERVER_MESSAGE_TYPE_GRID_CHANGE_ACCEPTED = 35;
    SERVER_MESSAGE_TYPE_GRID_CHANGE_REJECTED = 36;
    SERVER_MESSAGE_TYPE_GUI_INITIALIZATION = 37;
    SERVER_MESSAGE_TYPE_GRID_STATE_CHANGE = 38;
    SERVER_MESSAGE_TYPE_SWITCH_CHANGE_ACCEPTED = 39;
    SERVER_MESSAGE_TYPE_SWITCH_CHANGE_REJECTED = 40;
    SERVER_MESSAGE_TYPE_SYSTEM_STATE_CHANGE_ACCEPTED = 41;
    SERVER_MESSAGE_TYPE_SYSTEM_STATE_CHANGE_REJECTED = 42;
    SERVER_MESSAGE_TYPE_FORMAT_ERROR = 43;
    SERVER_MESSAGE_TYPE_PLAY_SOUND = 44;
    SERVER_MESSAGE_TYPE_DATA_POINT_SET = 45;
    SERVER_MESSAGE_TYPE_DATA_POINT = 46;
}

enum ERROR_CODE {
    ERROR_CODE_DECODE_MESSAGE_ERROR = -1;
    ERROR_CODE_WRONG_PROTOCOL_VERSION = -2;
    ERROR_CODE_CLIENT_IS_ALREADY_LOGGED_IN = -3;
    ERROR_CODE_INCORRECT_USERNAME = -4;
    ERROR_CODE_CLIENT_IS_NOT_LOGGED_IN = -5;
    ERROR_CODE_GATEWAY_DOWN = -6;
    ERROR_CODE_TRADER_IS_CLOSED_OR_CLOSING = -7;
}

message Error {
    optional ERROR_CODE errorCode = 1;
    optional string errorText = 2;
}

message ClientLogin {
	required uint32 messageID = 1;
    required string userName = 2;
    optional string version = 3;
    required uint32 heartbeatInterval = 4;
}

message ErrorMessage {
	required uint32 messageID = 1;
	required Error error = 2;
}

message ClientConnected {
    required uint32 messageID = 1;
    required string version = 2;
    required uint32 heartbeatInterval = 3;
}

message ClientClosed {
    required uint32 messageID = 1;
}

message GridCell {
    required uint32 row = 1;
    required uint32 col = 2;
    required string value = 3;
}

message GridUpdate {
	required uint32 messageID = 1;
    repeated GridCell cells = 2;
    required uint32 gridId = 3;
}

message RowHeaderCell {
    required string label = 1;
    required uint32 id = 2;
}

message ColumnHeaderCell {
    required string label = 1;
    required uint32 id = 2;
    required DataType type = 3;
    optional string enumerationName = 4;
    required bool readOnly = 5;
}

enum GridType {
    Table = 1;
    Matrix = 2;
    List = 3;
    MainControl = 4;
}

message GridDefinition {
    required uint32 gridId = 1;
    required GridType type = 2;
    required string name = 3;
    repeated ColumnHeaderCell columnHeader = 4;
	repeated RowHeaderCell rowHeader = 5;
    repeated GridCell cells = 6;
    optional bool clearCellsAfterSubmit = 7;
}

message GUIInitialization {
    required uint32 messageID = 1;
    repeated GridDefinition definitions = 2;
    repeated EnumDefinition enumDefinitions = 3;
    repeated Chart charts = 4;
}

enum SystemState {
    SystemStateHardShutdown = 0;
    SystemStateEnabled = 1;
    SystemStateDisabled = 2;
}

message SystemStateChange {
	required uint32 messageID = 1;
	required SystemState newState = 2;
}

message SwitchChange {
    required uint32 messageID = 1;
    required GridCell cell = 2;
    required uint32 gridId = 3;
}

message EmptyMessage {
    required uint32 messageID = 1;
}

message GridUpdateReply {
   required uint32 gridId = 1;
}

enum DataType {
    signed_type = 0;
    unsigned_type = 1;
    double_type = 2;
    string_type = 3;
    enum_type = 4;
    rhone_price = 5;
    bool_type = 6;
}

message EnumMember {
    required string display = 1;
    required uint32 id = 2;
}

message EnumDefinition {
    required string name = 1;
    repeated EnumMember members = 2;
}

message Chart {
    required string name = 1;
    required uint32 id = 2;
    repeated DataSeries series = 3;
}

message DataSeries {
    required string name = 1;
    required uint32 id = 2;
}

message DataSeriesPoint {
    required uint32 chartId = 1;
    required uint32 dataSeriesId = 2;
    required uint64 time = 3;
    required double value = 4;
}

message DataSeriesPointSet {
    repeated DataSeriesPoint points = 1;
}

message PlaySound {
    required uint32 id = 1;
}

