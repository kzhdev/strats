syntax = "proto2";
package Python.proto;
enum PROTOCOL_VERSION {
    VERSION = 1;
}
enum VENUE {
    VENUE_UNKNOWN = 0;
    VENUE_CME = 1;
    VENUE_ICE = 2;
    VENUE_EUREX = 3;
}

enum REQUEST_TYPE {
    REQUEST_TYPE_CLIENT_LOGIN = 1;
    REQUEST_TYPE_CLIENT_LOGOUT = 2;
    REQUEST_TYPE_GRID_CHANGE = 3;
    REQUEST_HEARTBEAT = 4;
    REQUEST_TYPE_GRID_INITIALIZATION_ACCEPTED = 5;
    REQUEST_TYPE_GRID_INITIALIZATION_REJECTED = 6;
}

enum RESPONSE_TYPE {
    RESPONSE_TYPE_CLIENT_CONNECTED = 30;
    RESPONSE_TYPE_CLIENT_REJECTED = 31;
    RESPONSE_TYPE_CLIENT_CLOSED = 32;
    RESPONSE_TYPE_CLIENT_CLOSE_REJECTED = 33;
    RESPONSE_HEARTBEAT = 34;
    RESPONSE_TYPE_FORMAT_ERROR = 35;
    RESPONSE_TYPE_GATEWAY_STATUS = 36;
    RESPONSE_TYPE_MARKET_DATA_STATUS = 37;
    RESPONSE_TYPE_GRID_CHANGE_ACCEPTED = 38;
    RESPONSE_TYPE_GRID_CHANGE_REJECTED = 39;
    RESPONSE_TYPE_GRID_INITIALIZATION = 40;
    RESPONSE_TYPE_GRID_STATE_CHANGE = 41;
}

enum ERROR_CODE {
    ERROR_CODE_DECODE_MESSAGE_ERROR = -1;
    ERROR_CODE_WRONG_PROTOCOL_VERSION = -2;
    ERROR_CODE_CLIENT_IS_ALREADY_LOGGED_IN = -3;
    ERROR_CODE_INCORRECT_USERNAME = -4;
    ERROR_CODE_CLIENT_IS_NOT_LOGGED_IN = -5;
    ERROR_CODE_GATEWAY_DOWN = -6;
    ERROR_CODE_TRADER_IS_CLOSED_OR_CLOSING = -7;
}

message Error {
    optional ERROR_CODE errorCode = 1;
    optional string errorText = 2;
}

message ClientLogin {
	required uint32 messageID = 1;
    required string userName = 2;
    optional string version = 3;
}

message OtherError {
	required uint32 messageID = 1;
	optional Error error = 2;
}

message ClientConnected {
    required uint32 messageID = 1;
    required string version = 2;
}

message ClientClosed {
    required uint32 messageID = 1;
}

message GridCell {
    required uint32 row = 1;
    required uint32 col = 2;
    required string value = 3;
}

message GridUpdate {
	required uint32 messageID = 1;
    repeated GridCell cells = 2;
    required uint32 gridId = 3;
}